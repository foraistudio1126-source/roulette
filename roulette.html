<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>TV MAGNET — ROULETTE</title>
<style>
@property --bdr-angle { syntax:'<angle>'; initial-value:0deg; inherits:false; }
* { margin:0; padding:0; box-sizing:border-box; }
html,body { width:1920px; height:1080px; overflow:hidden; background:#04050a; font-family:'Helvetica Neue',Arial,sans-serif; color:#e0e0e0; }
#back { position:fixed; top:18px; left:28px; font-size:13px; color:#333; text-decoration:none; letter-spacing:2px; z-index:200; }
#back:hover { color:#666; }
#title { position:fixed; top:18px; left:50%; transform:translateX(-50%); font-size:14px; color:#1e1e2a; letter-spacing:10px; z-index:200; font-weight:700; }
#rehearsal-badge { position:fixed; top:18px; right:28px; font-size:11px; color:#444; letter-spacing:4px; z-index:200; display:none; }
#rehearsal-badge.active { color:#aa66ff; display:block; }

canvas { position:absolute; inset:0; z-index:0; pointer-events:none; }

/* ── plates ── */
.plate-wrap { position:absolute; transform:translate(-50%,-50%); z-index:20; }
.plate-box {
  width:258px; height:122px;
  background:
    linear-gradient(180deg,rgba(42,46,60,.9) 0%,rgba(19,24,36,.98) 14%,rgba(9,12,20,.98) 100%),
    linear-gradient(90deg,rgba(255,255,255,.08),transparent 26%,transparent 74%,rgba(255,255,255,.05));
  border:2px solid rgba(106,136,194,.56); border-radius:4px;
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.11),
    inset 0 -1px 0 rgba(0,0,0,.45),
    0 0 24px rgba(40,90,220,.24),
    0 0 52px rgba(20,60,180,.08);
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px;
  position:relative; transition:border-color .3s, box-shadow .3s;
}
.plate-box::before{
  content:'';position:absolute;left:10px;right:10px;top:10px;height:1px;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.32),transparent);
}
.plate-box.locked.atari  { border-color:rgba(255,200,68,.92); box-shadow:0 0 44px rgba(255,200,68,.55), 0 0 100px rgba(255,160,0,.22); }
.plate-box.locked.futsuu { border-color:rgba(80,160,255,.95); box-shadow:0 0 44px rgba(51,136,255,.6), 0 0 100px rgba(30,100,255,.22); }
.plate-box.locked.hazure { border-color:rgba(70,90,140,.9); box-shadow:0 0 24px rgba(50,70,120,.4); }
.p-genre { font-size:10px; letter-spacing:3px; color:#2e2e48; transition:color .3s; }
.plate-box.locked.atari  .p-genre { color:#7a5c10; }
.plate-box.locked.futsuu .p-genre { color:#204878; }
.plate-box.locked.hazure .p-genre { color:#2e3d50; }
.p-text {
  font-size:28px; font-weight:800; letter-spacing:2px; color:#99aacc;
  text-align:center; padding:0 10px; line-height:1.2;
  max-width:210px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  transition:color .3s, font-size .15s, text-shadow .3s;
  text-shadow:0 0 10px rgba(60,120,255,.3);
}
.plate-box.locked.atari  .p-text { color:#ffee88; text-shadow:0 0 22px rgba(255,200,0,.6); font-size:30px; }
.plate-box.locked.futsuu .p-text { color:#ccdeff; text-shadow:0 0 18px rgba(80,160,255,.65); font-size:30px; }
.plate-box.locked.hazure .p-text { color:#6677aa; text-shadow:none; }
.p-type { font-size:11px; letter-spacing:4px; color:#1e1e32; transition:color .3s; }
.plate-box.locked.atari  .p-type { color:#cc9920; }
.plate-box.locked.futsuu .p-type { color:#4488cc; }
.plate-box.locked.hazure .p-type { color:#3e5068; }
.p-flash { position:absolute; inset:0; background:#fff; opacity:0; border-radius:6px; pointer-events:none; }

/* ── snap animation (scale + bounce + glow) ── */
@keyframes plateSnap {
  0%   { transform:scale(1);    filter:brightness(1) drop-shadow(0 0 0px transparent); }
  10%  { transform:scale(1.32); filter:brightness(5.5) drop-shadow(0 0 24px #fff); }
  28%  { transform:scale(0.88); filter:brightness(1.8) drop-shadow(0 0 12px #aacfff); }
  50%  { transform:scale(1.12); filter:brightness(1.25) drop-shadow(0 0 8px #88aaff); }
  70%  { transform:scale(0.96); filter:brightness(1.05); }
  85%  { transform:scale(1.03); filter:brightness(1); }
  100% { transform:scale(1);    filter:brightness(1); }
}
.plate-box.snap-anim { animation:plateSnap .58s cubic-bezier(.18,.1,.22,1); }

/* ── result area ── */
#result-area {
  position:fixed; bottom:34px; left:50%; transform:translateX(-50%);
  z-index:60; pointer-events:none; text-align:center;
  opacity:0; transition:opacity .7s;
  width:1780px;
}
#result-area.visible { opacity:1; }
#result-shell{
  position:relative;padding:28px 42px 34px;
  background:linear-gradient(180deg,rgba(26,31,44,.97),rgba(8,11,18,.99));
  border:2px solid rgba(138,156,198,.66);
  border-radius:6px;
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.08),
    0 0 64px rgba(0,0,0,.42),
    0 0 112px rgba(40,90,180,.16);
}
#result-shell::before{
  content:'';position:absolute;inset:8px;border:1px solid rgba(255,255,255,.06);border-radius:2px;
}
#result-kicker{
  font-size:12px;letter-spacing:7px;color:#6d7c9f;margin-bottom:8px;
}
#result-type {
  display:block;font-size:34px;font-weight:900;letter-spacing:12px;color:#edf3ff;
  text-shadow:0 0 16px rgba(255,255,255,.1);
}
#result-telop{
  margin-top:14px;font-size:18px;font-weight:900;letter-spacing:10px;color:#b1c0e6;
}
#result-item {
  margin-top:18px;letter-spacing:5px; color:#ffffff;
  white-space:normal; max-width:1700px; line-height:1.42; text-align:center;
  font-weight:900;
  text-shadow:0 3px 16px rgba(0,0,0,.68);
  word-break:break-word;
}

/* ── result reveal ── */
@keyframes resultReveal {
  0%   { opacity:0; transform:scaleY(.84) translateY(14px); filter:brightness(2.5); }
  55%  { opacity:1; transform:scaleY(1.03) translateY(-2px); filter:brightness(1.1); }
  100% { opacity:1; transform:scaleY(1) translateY(0); filter:brightness(1); }
}
#result-area.visible { opacity:1; }
#result-area.visible #result-shell { animation:resultReveal .5s cubic-bezier(.16,.9,.22,1) forwards; }

/* ── edge scroll strips ── */
.edge-scroll {
  position:absolute;left:-4px;right:-4px;height:26px;line-height:26px;
  overflow:hidden;pointer-events:none;opacity:0;transition:opacity .4s;
}
.edge-scroll span {
  display:inline-block;white-space:nowrap;font-weight:900;
}
#edge-top { top:-30px; }
#edge-bottom { bottom:-30px; }
#edge-top span { animation:edgeScrollR 6s linear infinite; }
#edge-bottom span { animation:edgeScrollR 6s linear infinite reverse; }
@keyframes edgeScrollR { from{transform:translateX(0)} to{transform:translateX(-50%)} }
@keyframes borderSweep { to{--bdr-angle:360deg} }

/* effect 1 — rotating light border + dim scroll text */
#result-area.eff-1 #result-type{color:#eef4ff;}
#result-area.eff-1 #result-item { color:#eef4ff; text-shadow:0 0 28px rgba(160,190,255,.65), 0 0 60px rgba(100,150,255,.3); }
#result-area.eff-1 .edge-scroll { opacity:1; }
#result-area.eff-1 .edge-scroll span {
  font-size:11px;letter-spacing:7px;color:rgba(140,180,255,.4);
  text-shadow:0 0 10px rgba(100,150,255,.25);
}
#result-area.eff-1 #result-shell::after {
  content:'';position:absolute;inset:-3px;border-radius:6px;pointer-events:none;
  background:conic-gradient(from var(--bdr-angle),transparent 0%,transparent 60%,rgba(140,190,255,.45) 76%,rgba(220,240,255,.85) 84%,rgba(140,190,255,.45) 92%,transparent 100%);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;mask-composite:exclude;padding:3px;
  animation:borderSweep 3s linear infinite;
}

/* effect 2 — hazard stripe */
@keyframes hazardFlow {
  from { background-position:0 0; }
  to   { background-position:56.57px 0; }
}
@keyframes eff2Glow {
  0%,100% { box-shadow:inset 0 1px 0 rgba(255,255,255,.1),0 0 70px rgba(240,196,0,.6),0 0 140px rgba(240,196,0,.32),0 0 240px rgba(220,160,0,.14); }
  50%     { box-shadow:inset 0 1px 0 rgba(255,255,255,.1),0 0 110px rgba(255,210,0,.9),0 0 200px rgba(240,196,0,.5),0 0 320px rgba(220,160,0,.24); }
}
#result-area.eff-2 #result-shell{
  border-color:#ffe050;
  animation:eff2Glow .5s ease-in-out infinite;
}
#result-area.eff-2 #result-shell::after{
  content:'';position:absolute;inset:-3px;border-radius:6px;pointer-events:none;
  background:repeating-linear-gradient(-45deg,#ffd200 0,#ffd200 12px,#1a1000 12px,#1a1000 24px);
  background-size:56.57px 56.57px;
  animation:hazardFlow .45s linear infinite;
  -webkit-mask:
    linear-gradient(#000 0 0) content-box,
    linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;
  mask-composite:exclude;
  padding:6px;
  opacity:.95;
}
#result-area.eff-2 #result-type,
#result-area.eff-2 #result-telop,
#result-area.eff-2 #result-item{
  color:#fff6a0;
  text-shadow:0 0 30px rgba(255,220,0,.7),0 0 70px rgba(255,180,0,.35);
}
#result-area.eff-2 .edge-scroll { opacity:1; }
#result-area.eff-2 .edge-scroll span {
  font-size:13px;letter-spacing:5px;color:#ffd200;
  text-shadow:0 0 16px rgba(240,196,0,.8),0 0 36px rgba(255,200,0,.35);
}
#result-area.eff-2 #edge-top span { animation-duration:3.5s; }
#result-area.eff-2 #edge-bottom span { animation-duration:3.5s; }

/* effect 3 — red WARNING */
@keyframes warningPulse {
  0%,100% { opacity:1; }
  50%     { opacity:.45; }
}
@keyframes eff3Shake {
  0%,100% { transform:none; }
  12%  { transform:translateX(-7px) rotate(-.4deg); }
  25%  { transform:translateX(5px) rotate(.3deg); }
  40%  { transform:translateX(-4px) rotate(-.2deg); }
  60%  { transform:translateX(4px) rotate(.2deg); }
  78%  { transform:translateX(-2px); }
}
@keyframes eff3Glow {
  0%,100% { box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 0 80px rgba(255,20,40,.55),0 0 180px rgba(255,0,30,.32),0 0 300px rgba(200,0,20,.14); border-color:rgba(255,60,80,.85); }
  50%     { box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 0 130px rgba(255,20,40,.85),0 0 250px rgba(255,0,30,.5),0 0 400px rgba(200,0,20,.24); border-color:rgba(255,100,120,1); }
}
@keyframes warningTextScroll {
  from { background-position:0 0; }
  to   { background-position:200px 0; }
}
@keyframes vignetteFlash {
  0%,100% { opacity:.55; }
  50%     { opacity:.85; }
}
#screen-vignette {
  position:fixed;inset:0;pointer-events:none;z-index:58;
  background:radial-gradient(ellipse at center,transparent 30%,rgba(200,0,20,.9) 100%);
  opacity:0;transition:opacity .4s;
}
#screen-vignette.on { opacity:.55; animation:vignetteFlash .55s ease-in-out infinite; }
#result-area.eff-3 #result-shell{
  animation:eff3Shake .15s ease-in-out infinite, eff3Glow .45s ease-in-out infinite;
}
#result-area.eff-3 #result-shell::after{
  content:'';position:absolute;inset:-4px;border-radius:6px;pointer-events:none;
  background:conic-gradient(from var(--bdr-angle),transparent 0%,rgba(255,30,50,.55) 12%,transparent 24%,rgba(255,30,50,.55) 36%,transparent 48%,rgba(255,30,50,.55) 62%,transparent 74%,rgba(255,30,50,.55) 86%,transparent 100%);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;mask-composite:exclude;padding:5px;
  animation:borderSweep 1.2s linear infinite;
}
#result-area.eff-3 .edge-scroll { opacity:1; animation:warningPulse .28s ease-in-out infinite; }
#result-area.eff-3 .edge-scroll span {
  font-size:15px;letter-spacing:6px;color:#ff3347;
  text-shadow:0 0 22px rgba(255,40,60,.95),0 0 48px rgba(255,0,30,.5);
}
#result-area.eff-3 #edge-top span { animation-duration:2.5s; }
#result-area.eff-3 #edge-bottom span { animation-duration:2.5s; }
#result-area.eff-3 #result-item {
  color:#fff0f2;
  text-shadow:0 0 24px rgba(255,30,50,.6),0 0 60px rgba(255,0,30,.3);
  animation:warningPulse .28s ease-in-out infinite;
}

#standby-label { position:fixed; bottom:80px; left:50%; transform:translateX(-50%); font-size:20px; letter-spacing:8px; color:#1e1e2e; z-index:55; pointer-events:none; }

/* ── UI ── */
#ui { position:fixed; bottom:18px; left:50%; transform:translateX(-50%); display:flex; align-items:center; gap:40px; z-index:100; }
.btn { padding:11px 30px; border:1.5px solid #2a2a3a; background:linear-gradient(180deg,#141420,#0e0e1a); color:#666; font-size:14px; letter-spacing:3px; cursor:pointer; border-radius:4px; transition:all .2s; }
.btn:hover { border-color:#444; color:#bbb; }
#btn-spin { border-color:#ff3344; color:#ff6677; padding:13px 56px; font-size:17px; font-weight:700; letter-spacing:5px; }
#btn-spin:hover { box-shadow:0 0 20px rgba(255,50,68,.3); border-color:#ff6677; }
#btn-spin:disabled { border-color:#1a1a28; color:#2a2a3a; box-shadow:none; cursor:not-allowed; }
#btn-timer { letter-spacing:2px; font-size:13px; opacity:.35; cursor:not-allowed !important; }
#btn-timer.ready { opacity:1; border-color:#ffaa44; color:#ffcc66; cursor:pointer !important; animation:timerPulse .9s ease-in-out infinite; }
#btn-timer.running { opacity:1; border-color:#ff3344; color:#ff6677; cursor:pointer !important; animation:timerBlink .6s ease-in-out infinite; }
@keyframes timerPulse { 0%,100%{box-shadow:0 0 10px rgba(255,170,60,.2)}50%{box-shadow:0 0 26px rgba(255,170,60,.6)} }
@keyframes timerBlink { 0%,100%{opacity:1}50%{opacity:.42} }
.lbl { font-size:13px; color:#333; letter-spacing:3px; }
.cnt { width:52px; height:38px; background:#0a0a14; border:1px solid #1e1e2a; display:flex; align-items:center; justify-content:center; font-size:24px; font-weight:700; border-radius:3px; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="screen-vignette"></div>
<div id="standby-label">— STANDBY —</div>
<div id="result-area">
  <div id="result-shell">
    <div id="edge-top" class="edge-scroll"><span></span></div>
    <div id="edge-bottom" class="edge-scroll"><span></span></div>
    <div id="result-kicker">ROULETTE RESULT</div>
    <div id="result-type"></div>
    <div id="result-telop"></div>
    <div id="result-item"></div>
  </div>
</div>
<a href="home.html" id="back">← HOME</a>
<div id="title">TV MAGNET</div>
<div id="rehearsal-badge">REHEARSAL</div>
<div id="ui">
  <span class="lbl">プレート数</span>
  <button class="btn" id="btn-m">－</button>
  <div class="cnt" id="cnt">4</div>
  <button class="btn" id="btn-p">＋</button>
  <button class="btn" id="btn-spin">SPIN</button>
  <button class="btn" id="btn-timer" disabled>TIMER START</button>
</div>
<script>
/* ══════════════════════════════════════════════════
   DATA
   ══════════════════════════════════════════════════ */
const STORAGE_KEY='tvmagnet';
const DEFAULT={
  plates:Array.from({length:6},(_,i)=>({genre:`プレート${i+1}`,atari:[],futsuu:[],hazure:[]})),
  probability:{atari:{pct:30,priority:'mid'},futsuu:{pct:40,priority:'weak'},hazure:{pct:30,priority:'strong'}},
  rehearsal:{enabled:false,sequence:Array(10).fill(null),index:0},
  effects:{
    names:{atari:'あたり',futsuu:'普通',hazure:'外れ'},
    mode:1
  },
  plateCount:4
};
function loadSettings(){
  try{
    const r=localStorage.getItem(STORAGE_KEY);
    if(r){
      const p=JSON.parse(r);
      const s=JSON.parse(JSON.stringify(DEFAULT));
      if(p.plates) s.plates=p.plates;
      if(p.probability) s.probability=Object.assign(s.probability,p.probability);
      if(p.rehearsal) s.rehearsal=Object.assign(s.rehearsal,p.rehearsal);
      if(p.effects){
        if(p.effects.names) s.effects.names=Object.assign(s.effects.names,p.effects.names);
        if(p.effects.mode!=null) s.effects.mode=Number(p.effects.mode)||1;
      }
      if(p.plateCount!=null) s.plateCount=p.plateCount;
      return s;
    }
  }catch(e){}
  return JSON.parse(JSON.stringify(DEFAULT));
}
function saveSettings(s){localStorage.setItem(STORAGE_KEY,JSON.stringify(s));}

/* ══════════════════════════════════════════════════
   GEOMETRY
   ══════════════════════════════════════════════════ */
const CX=960,CY=490,CORE_R=158,PLATE_R=430,PW=129,PH=61;
function getInnerR(a){return CORE_R+Math.abs(Math.cos(a))*PW+Math.abs(Math.sin(a))*PH-58;}
function getAngles(n){return Array.from({length:n},(_,i)=>-Math.PI/2+(i/n)*Math.PI*2);}

/* ── TIMING PARAMETERS (調整用) ── */
const TIMING={
  SHUFFLE_DUR:1200,    // シャッフル後のタメ（ms）
  REVEAL_GAP:420,      // 1プレートごとの結果確定間隔（ms）
  POST_REVEAL:550,     // 全結果出揃い後の余韻（ms）
  POST_SNAP:450        // 吸着後→テロップまでの待ち（ms）
};

const cv=document.getElementById('c'),ctx=cv.getContext('2d');
cv.width=1920;cv.height=1080;
let n=4,busy=false,plateData=[],shockwaves=[],pShocks=[],sparks=[],sparkIv=null,coreGlow=0,globalT=0;
let showingResult=false,resetting=false;
let coreAngle=0,coreRotSpeed=0;
let snapOnFullRotation=false,snapCallback=null,snapTargetAngle=0;
let timerActive=false,timerStartTime=0,timerDuration=0,timerMilestone=0,timerLastMilestoneCount=-1;

/* ══════════════════════════════════════════════════
   AUDIO (プリロード + 再生)
   ══════════════════════════════════════════════════ */
const SE={
  start:   new Audio('se/se_start.mp3'),
  rotation:new Audio('se/se_rotation.mp3'),
  reveal:  new Audio('se/se_reveal.mp3'),
  last:    new Audio('se/se_last.mp3'),
  snap:    new Audio('se/se_snap.mp3'),
  caution: new Audio('se/se_result_caution.mp3'),
  warning: new Audio('se/se_result_warning.mp3'),
  sparks:  new Audio('se/se_sparks.mp3')
};
SE.rotation.loop=true;
Object.values(SE).forEach(a=>{a.preload='auto';a.load();});

function playSE(key,vol){
  const a=SE[key];if(!a)return;
  a.currentTime=0;a.volume=vol??1;
  a.play().catch(()=>{});
}
function stopSE(key,fadeMs){
  const a=SE[key];if(!a)return;
  if(fadeMs){
    const step=a.volume/(fadeMs/20);
    const iv=setInterval(()=>{a.volume=Math.max(0,a.volume-step);if(a.volume<=0){clearInterval(iv);a.pause();a.currentTime=0;a.volume=1;}},20);
  }else{a.pause();a.currentTime=0;}
}

/* ══════════════════════════════════════════════════
   HELPERS
   ══════════════════════════════════════════════════ */
function getAllItems(p){
  return [...(p.atari||[]).map(t=>({text:t,type:'atari'})),...(p.futsuu||[]).map(t=>({text:t,type:'futsuu'})),...(p.hazure||[]).map(t=>({text:t,type:'hazure'}))];
}
function pickFromPool(p,type){
  const pool=type==='atari'?(p.atari||[]):type==='futsuu'?(p.futsuu||[]):(p.hazure||[]);
  if(pool.length) return {text:pool[Math.floor(Math.random()*pool.length)],type};
  const all=getAllItems(p);if(all.length) return all[Math.floor(Math.random()*all.length)];
  return {text:p.genre||'?',type};
}
/* 単語をランダムに1つ選ぶ — タイプは単語に紐付いたものをそのまま使う
   excludeSet: 共有プレート間の重複防止用（使用済みテキストのSet） */
function pickRandomItem(plate,forceType,excludeSet){
  if(forceType){
    const item=pickFromPool(plate,forceType);
    if(excludeSet && excludeSet.has(item.text)){
      // 除外対象 → 同タイプの別アイテムを探す
      const pool=(plate[forceType]||[]).filter(t=>!excludeSet.has(t));
      if(pool.length) return {text:pool[Math.floor(Math.random()*pool.length)],type:forceType};
    }
    return item;
  }
  let all=getAllItems(plate);
  if(excludeSet) all=all.filter(it=>!excludeSet.has(it.text));
  if(all.length===0){
    // 除外なしでも空ならフォールバック
    const fallback=getAllItems(plate);
    if(fallback.length) return fallback[Math.floor(Math.random()*fallback.length)];
    return {text:plate.genre||'?',type:'hazure'};
  }
  return all[Math.floor(Math.random()*all.length)];
}
function getTypeName(type,settings){
  return settings.effects?.names?.[type]||DEFAULT.effects.names[type];
}
/* 多数決で演出レベルを決定（優先: あたり>普通>ハズレ） */
function determineEffectByMajority(){
  const c={atari:0,futsuu:0,hazure:0};
  plateData.forEach(pd=>{ if(pd.lockedType) c[pd.lockedType]++; });
  // あたりが最多 or 同数なら最優先
  if(c.atari>=c.futsuu && c.atari>=c.hazure) return {level:3};
  // 普通が最多 or ハズレと同数なら次に優先
  if(c.futsuu>=c.hazure) return {level:2};
  // ハズレ最多
  return {level:1};
}

/* ══════════════════════════════════════════════════
   BUILD PLATES
   ══════════════════════════════════════════════════ */
function build(){
  document.querySelectorAll('.plate-wrap').forEach(e=>e.remove());
  plateData=[];
  const settings=loadSettings();
  getAngles(n).forEach((ang,i)=>{
    const rawCfg=settings.plates[i]||DEFAULT.plates[i%6];
    const isTimer=!!(rawCfg.timerMode&&(rawCfg.timerEntries||[]).length>0);
    // 共有先が設定されていれば、共有元のアイテムプールを使う
    const srcIdx=rawCfg.shareWith;
    const itemSrc=(srcIdx!=null && settings.plates[srcIdx])?settings.plates[srcIdx]:rawCfg;
    const cfg={...rawCfg, atari:itemSrc.atari, futsuu:itemSrc.futsuu, hazure:itemSrc.hazure};
    // タイマープレートはtimerEntriesからアイテムリストを生成
    const allItems=isTimer
      ? (rawCfg.timerEntries||[]).map(e=>({text:`${e.seconds}秒`,type:e.type||'futsuu'}))
      : getAllItems(cfg);
    const ox=CX+Math.cos(ang)*PLATE_R,oy=CY+Math.sin(ang)*PLATE_R;
    const ir=getInnerR(ang);
    const ix=CX+Math.cos(ang)*ir,iy=CY+Math.sin(ang)*ir;
    const isN=Math.sin(ang)<0;
    const wrap=document.createElement('div');wrap.className='plate-wrap';
    wrap.style.left=ox+'px';wrap.style.top=oy+'px';
    const box=document.createElement('div');box.className='plate-box';
    box.innerHTML=`<div class="p-genre">${cfg.genre||`プレート${i+1}`}</div>`+
      `<div class="p-text">${allItems.length?allItems[0].text:'—'}</div>`+
      `<div class="p-type">—</div><div class="p-flash"></div>`;
    wrap.appendChild(box);document.body.appendChild(wrap);
    plateData.push({wrap,box,ox,oy,ix,iy,angle:ang,cfg,allItems,isN,cycleIdx:0,state:'idle',locked:false,lockedType:null,assignedItem:null,isTimer,timerEntry:null,timerEntries:rawCfg.timerEntries||[]});
  });
  coreGlow=0;
  document.getElementById('rehearsal-badge').className=loadSettings().rehearsal?.enabled?'active':'';
}

/* ══════════════════════════════════════════════════
   CANVAS DRAW LOOP
   ══════════════════════════════════════════════════ */
function drawFrame(){
  ctx.clearRect(0,0,1920,1080);
  // bg grid
  for(let x=0;x<1920;x+=100)for(let y=0;y<1080;y+=100){ctx.beginPath();ctx.arc(x,y,1.1,0,Math.PI*2);ctx.fillStyle='rgba(30,50,90,.07)';ctx.fill();}

  // field lines
  plateData.forEach(pd=>{
    const sx=CX+Math.cos(pd.angle)*(CORE_R+2),sy=CY+Math.sin(pd.angle)*(CORE_R+2);
    const tx=pd.locked?pd.ix:pd.ox,ty=pd.locked?pd.iy:pd.oy;
    if(pd.locked){
      const col=pd.lockedType==='atari'?'255,200,68':pd.lockedType==='futsuu'?'60,140,255':'55,75,120';
      const pulse=.45+.28*Math.sin(globalT*.04+pd.angle);
      ctx.beginPath();ctx.moveTo(sx,sy);ctx.lineTo(tx,ty);ctx.strokeStyle=`rgba(${col},${pulse*.28})`;ctx.lineWidth=18;ctx.stroke();
      ctx.beginPath();ctx.moveTo(sx,sy);ctx.lineTo(tx,ty);ctx.strokeStyle=`rgba(${col},${pulse*.14})`;ctx.lineWidth=32;ctx.stroke();
      ctx.beginPath();ctx.moveTo(sx,sy);ctx.lineTo(tx,ty);ctx.strokeStyle=`rgba(${col},${pulse})`;ctx.lineWidth=2.5;ctx.stroke();
    }else{
      const bc=pd.isN?'200,80,100':'40,100,220';
      const pulse=.22+.1*Math.sin(globalT*.05+pd.angle*1.8);
      ctx.save();ctx.setLineDash([9,14]);ctx.lineDashOffset=-(globalT*.75)%23;
      ctx.beginPath();ctx.moveTo(sx,sy);ctx.lineTo(tx,ty);ctx.strokeStyle=`rgba(${bc},${pulse})`;ctx.lineWidth=1.8;ctx.stroke();ctx.restore();
    }
  });

  // plate shockwaves
  pShocks=pShocks.filter(sw=>{sw.r+=10;sw.a-=.042;if(sw.a<=0)return false;ctx.beginPath();ctx.arc(sw.x,sw.y,sw.r,0,Math.PI*2);ctx.strokeStyle=`rgba(${sw.col},${sw.a})`;ctx.lineWidth=2.5;ctx.stroke();return true;});

  // core shockwaves
  shockwaves=shockwaves.filter(sw=>{sw.r+=9;sw.a-=.025;if(sw.a<=0)return false;ctx.beginPath();ctx.arc(CX,CY,sw.r,0,Math.PI*2);ctx.strokeStyle=`rgba(${sw.col||'100,180,255'},${sw.a})`;ctx.lineWidth=2;ctx.stroke();return true;});

  // sparks
  sparks=sparks.filter(s=>{
    s.x+=s.vx;s.y+=s.vy;s.vy+=.12;s.vx*=.99;s.life-=s.decay;
    if(s.life<=0)return false;
    const sz=s.size*s.life;
    ctx.beginPath();ctx.arc(s.x,s.y,sz,0,Math.PI*2);ctx.fillStyle=`rgba(${s.col},${s.life})`;ctx.fill();
    ctx.beginPath();ctx.moveTo(s.x,s.y);ctx.lineTo(s.x-s.vx*2,s.y-s.vy*2);ctx.strokeStyle=`rgba(${s.col},${s.life*.35})`;ctx.lineWidth=sz*.5;ctx.stroke();
    return true;
  });

  // ── MAGNET CORE (with rotation) ──
  if(timerActive){
    // 時間ベース回転: 総秒数=1回転
    const elapsed=(performance.now()-timerStartTime)/1000;
    coreAngle=(elapsed/timerDuration)*Math.PI*2;
    // 節目チェック
    const mc=Math.floor(elapsed/timerMilestone);
    if(mc>timerLastMilestoneCount&&timerLastMilestoneCount>=0){
      timerLastMilestoneCount=mc;
      if(mc>0) fireMilestoneSparks();
    }
    // 終了チェック
    if(elapsed>=timerDuration){
      timerActive=false;coreAngle=0;coreRotSpeed=0;
      stopSE('rotation',100);playSE('snap',1);
      const btn=document.getElementById('btn-timer');
      btn.textContent='TIMER START';btn.classList.remove('running');btn.disabled=true;
      busy=false;showingResult=true;
      document.getElementById('btn-spin').disabled=false;
    }
  } else {
    coreAngle+=coreRotSpeed;
    // N/Sが元の位置（2πの倍数）に達したら → スナップ発動
    if(snapOnFullRotation&&coreAngle>=snapTargetAngle){
      snapOnFullRotation=false;
      coreAngle=0;coreRotSpeed=0;
      if(snapCallback){snapCallback();snapCallback=null;}
    }
  }

  const glow=coreGlow+.15*Math.sin(globalT*.03);
  ctx.save();
  ctx.translate(CX,CY);ctx.rotate(coreAngle);ctx.translate(-CX,-CY);
  // N halo
  const nH=ctx.createRadialGradient(CX,CY-CORE_R*.4,0,CX,CY-CORE_R*.4,CORE_R*1.8);
  nH.addColorStop(0,`rgba(255,50,70,${.08+glow*.12})`);nH.addColorStop(1,'rgba(255,50,70,0)');
  ctx.fillStyle=nH;ctx.fillRect(CX-CORE_R*2,CY-CORE_R*2,CORE_R*4,CORE_R*2);
  // S halo
  const sH=ctx.createRadialGradient(CX,CY+CORE_R*.4,0,CX,CY+CORE_R*.4,CORE_R*1.8);
  sH.addColorStop(0,`rgba(30,100,255,${.08+glow*.12})`);sH.addColorStop(1,'rgba(30,100,255,0)');
  ctx.fillStyle=sH;ctx.fillRect(CX-CORE_R*2,CY,CORE_R*4,CORE_R*2);
  // N fill
  ctx.save();ctx.beginPath();ctx.arc(CX,CY,CORE_R,-Math.PI,0);ctx.closePath();
  const ng=ctx.createLinearGradient(CX,CY-CORE_R,CX,CY);
  ng.addColorStop(0,`rgba(255,70,90,${.75+glow*.2})`);ng.addColorStop(.55,`rgba(180,20,45,${.88+glow*.1})`);ng.addColorStop(1,'rgba(90,5,20,.95)');
  ctx.fillStyle=ng;ctx.fill();ctx.restore();
  // S fill
  ctx.save();ctx.beginPath();ctx.arc(CX,CY,CORE_R,0,Math.PI);ctx.closePath();
  const sg=ctx.createLinearGradient(CX,CY,CX,CY+CORE_R);
  sg.addColorStop(0,'rgba(60,90,200,.92)');sg.addColorStop(.55,`rgba(20,60,200,${.88+glow*.1})`);sg.addColorStop(1,`rgba(5,25,140,${.75+glow*.2})`);
  ctx.fillStyle=sg;ctx.fill();ctx.restore();
  // equator band
  ctx.save();ctx.beginPath();ctx.rect(CX-CORE_R,CY-4,CORE_R*2,8);
  const mg=ctx.createLinearGradient(0,CY-4,0,CY+4);mg.addColorStop(0,'rgba(240,240,255,.15)');mg.addColorStop(.5,'rgba(200,210,240,.8)');mg.addColorStop(1,'rgba(240,240,255,.15)');
  ctx.fillStyle=mg;ctx.fill();ctx.restore();
  ctx.beginPath();ctx.moveTo(CX-CORE_R,CY);ctx.lineTo(CX+CORE_R,CY);ctx.strokeStyle='rgba(210,220,255,.5)';ctx.lineWidth=1.5;ctx.stroke();
  // ring
  ctx.beginPath();ctx.arc(CX,CY,CORE_R,0,Math.PI*2);ctx.strokeStyle=`rgba(180,190,230,${.5+glow*.2})`;ctx.lineWidth=2.5;ctx.stroke();
  ctx.beginPath();ctx.arc(CX,CY,CORE_R-6,0,Math.PI*2);ctx.strokeStyle=`rgba(220,225,255,${.1+.08*Math.sin(globalT*.04)})`;ctx.lineWidth=1;ctx.stroke();
  for(let a=0;a<4;a++){const ang=globalT*.035+a*Math.PI*.5;ctx.beginPath();ctx.arc(CX,CY,CORE_R-12,ang,ang+.55);ctx.strokeStyle=`rgba(255,255,255,${.06+glow*.06})`;ctx.lineWidth=1.5;ctx.stroke();}
  // N / S labels
  const ls=Math.round(CORE_R*.38);ctx.font=`900 ${ls}px 'Helvetica Neue',Arial`;ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillStyle=`rgba(255,190,200,${.9+glow*.1})`;ctx.fillText('N',CX,CY-CORE_R*.42);
  ctx.fillStyle=`rgba(140,200,255,${.9+glow*.1})`;ctx.fillText('S',CX,CY+CORE_R*.42);
  ctx.restore(); // end core rotation

  coreGlow=Math.max(0,coreGlow-.012);
  globalT++;requestAnimationFrame(drawFrame);
}

/* ══════════════════════════════════════════════════
   CYCLE
   ══════════════════════════════════════════════════ */
let cycleIv;
function startCycle(ms){clearInterval(cycleIv);cycleIv=setInterval(()=>{plateData.forEach(pd=>{if(pd.state==='idle'&&pd.allItems.length>0){pd.cycleIdx=(pd.cycleIdx+1)%pd.allItems.length;pd.box.querySelector('.p-text').textContent=pd.allItems[pd.cycleIdx].text;}});},ms||90);}
function stopCycle(){clearInterval(cycleIv);}

/* ══════════════════════════════════════════════════
   SPARK EMITTER (effect 3)
   ══════════════════════════════════════════════════ */
function startSparks(){
  let elapsed=0;
  const cols=['255,100,60','255,220,80','255,160,40','255,80,30','255,240,120','255,255,200','255,120,80','255,200,100'];
  sparkIv=setInterval(()=>{
    elapsed+=20;
    if(elapsed>3200){clearInterval(sparkIv);sparkIv=null;return;}
    // core burst sparks — fast, screen-spanning
    for(let i=0;i<24;i++){
      const ang=Math.random()*Math.PI*2;
      const spd=12+Math.random()*28;
      sparks.push({
        x:CX+(Math.random()-.5)*120,y:CY+(Math.random()-.5)*120,
        vx:Math.cos(ang)*spd,vy:Math.sin(ang)*spd-3,
        life:1,decay:.004+Math.random()*.008,size:3+Math.random()*7,
        col:cols[Math.floor(Math.random()*cols.length)]
      });
    }
    // plate-edge sparks — also fast and wide
    plateData.forEach(pd=>{
      if(!pd.locked)return;
      for(let i=0;i<6;i++){
        const ang=Math.random()*Math.PI*2;
        const spd=8+Math.random()*20;
        const col=pd.lockedType==='atari'?'255,200,60':pd.lockedType==='futsuu'?'80,160,255':'255,100,60';
        sparks.push({
          x:pd.ix+(Math.random()-.5)*120,y:pd.iy+(Math.random()-.5)*120,
          vx:Math.cos(ang)*spd,vy:Math.sin(ang)*spd-2,
          life:1,decay:.005+Math.random()*.012,size:2+Math.random()*5.5,col
        });
      }
    });
  },20);
}

function clearResultPanel(){
  const ra=document.getElementById('result-area');
  ra.className='';
  document.getElementById('result-kicker').textContent='ROULETTE RESULT';
  document.getElementById('result-type').textContent='';
  document.getElementById('result-telop').textContent='';
  document.getElementById('result-item').textContent='';
  document.querySelector('#edge-top span').textContent='';
  document.querySelector('#edge-bottom span').textContent='';
}

function resetToOrbit(){
  if(busy || resetting) return;
  resetting=true;
  showingResult=false;
  clearResultPanel();
  document.getElementById('btn-spin').disabled=true;
  plateData.forEach(pd=>{
    pd.state='idle';
    pd.locked=false;
    pd.lockedType=null;
    pd.targetType=null;
    pd.assignedItem=null;
    pd.box.className='plate-box';
    pd.box.querySelector('.p-type').textContent='—';
    pd.box.querySelector('.p-text').textContent=pd.allItems.length?pd.allItems[0].text:'—';
    pd.wrap.style.transition='left .34s cubic-bezier(.25,.7,.2,1),top .34s cubic-bezier(.25,.7,.2,1)';
    pd.wrap.style.left=pd.ox+'px';
    pd.wrap.style.top=pd.oy+'px';
  });
  if(sparkIv){clearInterval(sparkIv);sparkIv=null;}
  shockwaves=[];
  pShocks=[];
  sparks=[];
  coreGlow=0;
  coreAngle=0;coreRotSpeed=0;
  snapOnFullRotation=false;snapCallback=null;snapTargetAngle=0;
  timerActive=false;
  const tb=document.getElementById('btn-timer');
  if(tb){tb.disabled=true;tb.classList.remove('ready','running');tb.textContent='TIMER START';}
  // SE全停止
  Object.keys(SE).forEach(k=>stopSE(k));
  document.getElementById('screen-vignette').className='';
  setTimeout(()=>{
    resetting=false;
    document.getElementById('btn-spin').disabled=false;
    document.getElementById('standby-label').style.display='';
  },420);
}

/* ══════════════════════════════════════════════════
   SPIN
   ══════════════════════════════════════════════════ */
function fire(){
  if(showingResult){
    resetToOrbit();
    return;
  }
  if(busy)return;busy=true;
  showingResult=false;
  document.getElementById('btn-spin').disabled=true;
  document.getElementById('standby-label').style.display='none';
  clearResultPanel();

  const settings=loadSettings();

  // ── リハーサル判定 ──
  let forceType=null;
  if(settings.rehearsal&&settings.rehearsal.enabled){
    const idx=(settings.rehearsal.index||0)%10;
    const forced=settings.rehearsal.sequence[idx];
    if(forced!=null&&forced!==''){
      forceType=forced;
      settings.rehearsal.index=(idx+1)%10;
      saveSettings(settings);
    }
  }

  // reset plates to outer orbit
  plateData.forEach(pd=>{
    pd.state='idle';pd.locked=false;pd.lockedType=null;pd.assignedItem=null;pd.targetType=null;
    pd.box.className='plate-box';
    pd.box.querySelector('.p-type').textContent='—';
    pd.box.querySelector('.p-text').textContent=pd.allItems.length?pd.allItems[0].text:'—';
    pd.wrap.style.transition='none';pd.wrap.style.left=pd.ox+'px';pd.wrap.style.top=pd.oy+'px';
  });
  coreGlow=0;pShocks=[];shockwaves=[];sparks=[];
  if(sparkIv){clearInterval(sparkIv);sparkIv=null;}

  // ── SE: スタート音 + 回転音ループ ──
  playSE('start');
  setTimeout(()=>playSE('rotation',.6),200);

  // ── シャッフル開始 + 磁石回転 ──
  startCycle(80);
  coreRotSpeed=.07;
  setTimeout(()=>{coreGlow=.4;shockwaves.push({r:8,a:.6,col:'150,180,255'},{r:22,a:.4,col:'150,180,255'});},300);

  // ── 共有グループ別の使用済みアイテム追跡 ──
  // key=共有元インデックス, value=Set of used texts
  const usedByGroup={};
  function getExcludeSet(pdIdx){
    const rawCfg=settings.plates[pdIdx]||{};
    const srcIdx=rawCfg.shareWith!=null?rawCfg.shareWith:pdIdx;
    if(!usedByGroup[srcIdx]) usedByGroup[srcIdx]=new Set();
    return usedByGroup[srcIdx];
  }

  // ── ① 時計回りに1つずつ結果確定（上→右→下→左）──
  plateData.forEach((pd,i)=>{
    setTimeout(()=>{
      let item;
      if(pd.isTimer){
        // タイマープレート: timerEntriesからランダムに1件選択
        const entries=pd.timerEntries;
        const entry=entries[Math.floor(Math.random()*entries.length)];
        const tType=entry.type||'futsuu';
        pd.timerEntry=entry;
        item={text:`${entry.seconds}秒`,type:tType};
      } else {
        const excludeSet=getExcludeSet(i);
        item=pickRandomItem(pd.cfg,forceType,excludeSet);
        excludeSet.add(item.text);
      }
      pd.assignedItem=item;
      pd.lockedType=item.type;
      pd.targetType=item.type;
      pd.state='revealed';
      pd.box.querySelector('.p-text').textContent=item.text;
      pd.box.querySelector('.p-type').textContent=getTypeName(item.type,settings);
      pd.box.classList.add('locked',item.type);
      const fl=pd.box.querySelector('.p-flash');
      fl.style.transition='none';fl.style.opacity='.7';
      setTimeout(()=>{fl.style.transition='opacity .25s';fl.style.opacity='0';},60);
      const col=item.type==='atari'?'255,200,68':item.type==='futsuu'?'60,140,255':'70,90,140';
      pShocks.push({x:pd.ox,y:pd.oy,r:6,a:.8,col},{x:pd.ox,y:pd.oy,r:18,a:.5,col});
      coreGlow=Math.min(1,.3+i*.2);
      // SE: 最後の1枚は別の音
      playSE(i===n-1?'last':'reveal',.8);
    },TIMING.SHUFFLE_DUR+i*TIMING.REVEAL_GAP);
  });

  // ── ② すべて出揃い → N/Sが元の位置に戻る瞬間に吸着 ──
  const ALL_REVEALED=TIMING.SHUFFLE_DUR+n*TIMING.REVEAL_GAP;

  setTimeout(()=>{
    // 次の2πの倍数（N/S正位置）を計算 — 少なくとも1回転先
    const minTarget=coreAngle+Math.PI*2;
    snapTargetAngle=Math.ceil(minTarget/(Math.PI*2))*(Math.PI*2);
    coreRotSpeed=.065;
    snapOnFullRotation=true;
    snapCallback=()=>{
      stopCycle();
      // SE: 回転音フェードアウト + 吸着音
      stopSE('rotation',200);
      playSE('snap',1);
      // 全プレート同時にガチャン！
      plateData.forEach(pd=>{
        pd.state='locked';
        pd.locked=true;
        pd.wrap.style.transition='left .34s cubic-bezier(.18,.85,.1,1.22),top .34s cubic-bezier(.18,.85,.1,1.22)';
        pd.wrap.style.left=pd.ix+'px';
        pd.wrap.style.top=pd.iy+'px';
        const col=pd.lockedType==='atari'?'255,200,68':pd.lockedType==='futsuu'?'60,140,255':'70,90,140';
        pShocks.push(
          {x:pd.ix,y:pd.iy,r:8,a:1,col},{x:pd.ix,y:pd.iy,r:22,a:.9,col},
          {x:pd.ix,y:pd.iy,r:42,a:.65,col},{x:pd.ix,y:pd.iy,r:68,a:.4,col}
        );
        pd.box.classList.add('snap-anim');
        setTimeout(()=>pd.box.classList.remove('snap-anim'),680);
      });
      coreGlow=1;
      shockwaves.push(
        {r:10,a:.95,col:'255,255,255'},{r:26,a:.85,col:'200,220,255'},
        {r:50,a:.7,col:'180,200,255'},{r:80,a:.5,col:'140,180,255'},
        {r:120,a:.35,col:'100,160,255'},{r:180,a:.2,col:'80,140,255'}
      );
      // ── ③ テロップ表示（多数決で演出レベル決定 + SE）──
      setTimeout(()=>{
        const eff=determineEffectByMajority();
        if(eff.level===3) playSE('warning',.85);
        else if(eff.level===2) playSE('caution',.85);
        playEffect(eff,settings);
      },TIMING.POST_SNAP);
    };
  },ALL_REVEALED+TIMING.POST_REVEAL);
}

/* ══════════════════════════════════════════════════
   POST-LOCK EFFECT
   ══════════════════════════════════════════════════ */
function playEffect(eff,settings){
  if(eff.level===3){
    // massive red burst + sparks
    setTimeout(()=>{
      coreGlow=1;
      shockwaves.push(
        {r:8,a:1,col:'255,60,50'},{r:24,a:.95,col:'255,100,60'},
        {r:50,a:.85,col:'255,80,40'},{r:90,a:.7,col:'255,60,30'},
        {r:150,a:.5,col:'200,40,20'},{r:230,a:.35,col:'160,20,10'},
        {r:340,a:.22,col:'120,10,5'},{r:480,a:.12,col:'80,5,0'}
      );
      startSparks();
      playSE('sparks',.9);
    },80);
    // second pulse
    setTimeout(()=>{
      shockwaves.push(
        {r:12,a:.9,col:'255,80,60'},{r:50,a:.75,col:'255,60,40'},
        {r:100,a:.55,col:'200,40,20'},{r:180,a:.35,col:'160,20,10'}
      );
    },420);
    // vignette on
    setTimeout(()=>{ document.getElementById('screen-vignette').className='on'; },80);
    setTimeout(()=>showResult(eff,settings),1600);
  } else if(eff.level===2){
    // yellow → purple transition shockwaves
    setTimeout(()=>{
      coreGlow=1;
      shockwaves.push(
        {r:10,a:.95,col:'255,200,0'},{r:30,a:.88,col:'255,200,0'},
        {r:60,a:.78,col:'255,180,0'},{r:100,a:.62,col:'220,150,0'},
        {r:160,a:.45,col:'180,120,0'},{r:240,a:.3,col:'140,90,0'}
      );
    },80);
    // second wave: purple shift
    setTimeout(()=>{
      shockwaves.push(
        {r:12,a:.95,col:'180,60,255'},{r:40,a:.85,col:'160,40,240'},
        {r:80,a:.7,col:'140,30,220'},{r:140,a:.52,col:'120,20,200'},
        {r:220,a:.35,col:'100,10,180'},{r:320,a:.2,col:'80,0,160'}
      );
    },350);
    // third wave: red+blue mix
    setTimeout(()=>{
      shockwaves.push(
        {r:15,a:.85,col:'200,50,180'},{r:50,a:.65,col:'160,30,200'},
        {r:100,a:.45,col:'130,20,220'}
      );
    },550);
    setTimeout(()=>showResult(eff,settings),1000);
  } else {
    // wider white/blue ripple for eff-1
    setTimeout(()=>{
      coreGlow=.7;
      shockwaves.push(
        {r:12,a:.9,col:'220,230,255'},{r:36,a:.8,col:'200,215,255'},
        {r:70,a:.65,col:'180,200,255'},{r:120,a:.48,col:'160,185,255'},
        {r:190,a:.32,col:'140,170,255'},{r:280,a:.2,col:'120,150,240'},
        {r:400,a:.1,col:'100,130,220'}
      );
    },80);
    setTimeout(()=>showResult(eff,settings),780);
  }
}

function showResult(eff,settings){
  const items=plateData.map(pd=>pd.assignedItem?pd.assignedItem.text:'?');
  const fs=n<=2?62:n<=4?52:40;
  document.getElementById('result-item').style.fontSize=fs+'px';
  document.getElementById('result-item').textContent=items.join('  ×  ');
  document.getElementById('result-type').textContent='';
  document.getElementById('result-telop').textContent='';
  document.getElementById('result-kicker').textContent='';
  // edge scroll text
  const edgeTexts={
    1:'● RESULT ● RESULT ● RESULT ● RESULT ● RESULT ● RESULT ● RESULT ● RESULT ',
    2:'▰ CAUTION ▰ CAUTION ▰ CAUTION ▰ CAUTION ▰ CAUTION ▰ CAUTION ▰ CAUTION ▰ CAUTION ',
    3:'■ WARNING ■ WARNING ■ WARNING ■ WARNING ■ WARNING ■ WARNING ■ WARNING ■ WARNING '
  };
  const txt=(edgeTexts[eff.level]||'').repeat(2);
  document.querySelector('#edge-top span').textContent=txt;
  document.querySelector('#edge-bottom span').textContent=txt;
  document.getElementById('result-area').className=`visible eff-${eff.level}`;
  busy=false;
  showingResult=true;
  document.getElementById('btn-spin').disabled=false;
  // タイマープレートがあればTIMER STARTを有効化
  if(plateData.some(pd=>pd.isTimer)){
    const btn=document.getElementById('btn-timer');
    btn.disabled=false;btn.classList.add('ready');
  }
}

/* ══════════════════════════════════════════════════
   TIMER
   ══════════════════════════════════════════════════ */
function startTimer(){
  if(timerActive) return;
  const pd=plateData.find(p=>p.isTimer&&p.timerEntry);
  if(!pd) return;
  timerDuration=pd.timerEntry.seconds;
  timerMilestone=pd.timerEntry.milestone;
  timerLastMilestoneCount=0;
  timerStartTime=performance.now();
  timerActive=true;
  // テロップを閉じて画面をスッキリさせる
  clearResultPanel();
  document.getElementById('screen-vignette').className='';
  playSE('rotation',.6);
  const btn=document.getElementById('btn-timer');
  btn.textContent='STOP / CANCEL';btn.classList.remove('ready');btn.classList.add('running');
  document.getElementById('btn-spin').disabled=true;
}

function stopTimer(){
  if(!timerActive) return;
  timerActive=false;
  coreAngle=0;coreRotSpeed=0;
  stopSE('rotation',300);
  const btn=document.getElementById('btn-timer');
  btn.textContent='TIMER START';btn.classList.remove('running');btn.classList.add('ready');
  document.getElementById('btn-spin').disabled=false;
}

function fireMilestoneSparks(){
  // N極・S極の位置を回転角度から算出
  const nX=CX+Math.sin(coreAngle)*CORE_R*.85;
  const nY=CY-Math.cos(coreAngle)*CORE_R*.85;
  const sX=CX-Math.sin(coreAngle)*CORE_R*.85;
  const sY=CY+Math.cos(coreAngle)*CORE_R*.85;
  [[nX,nY,'255,130,100'],[sX,sY,'100,190,255']].forEach(([px,py,col])=>{
    for(let i=0;i<22;i++){
      const ang=Math.random()*Math.PI*2,spd=5+Math.random()*18;
      sparks.push({x:px+(Math.random()-.5)*30,y:py+(Math.random()-.5)*30,
        vx:Math.cos(ang)*spd,vy:Math.sin(ang)*spd-1,
        life:1,decay:.011+Math.random()*.016,size:2.5+Math.random()*5,col});
    }
  });
  shockwaves.push(
    {r:14,a:.72,col:'255,160,80'},{r:38,a:.5,col:'255,200,80'},{r:78,a:.3,col:'255,180,60'}
  );
  flashScreen('rgba(255,200,100,.13)');
  playSE('sparks',.65);
}

function flashScreen(bg){
  const f=document.createElement('div');
  f.style.cssText=`position:fixed;inset:0;background:${bg};pointer-events:none;z-index:57;transition:opacity .75s ease-out;`;
  document.body.appendChild(f);
  requestAnimationFrame(()=>requestAnimationFrame(()=>{f.style.opacity='0';setTimeout(()=>f.remove(),900);}));
}

/* ══════════════════════════════════════════════════
   CONTROLS
   ══════════════════════════════════════════════════ */
function updateCount(newN){
  showingResult=false;
  n=newN;document.getElementById('cnt').textContent=n;
  document.getElementById('standby-label').style.display='';
  clearResultPanel();
  const s=loadSettings();s.plateCount=n;saveSettings(s);build();
}
document.getElementById('btn-m').onclick=()=>{if(n>1&&!busy)updateCount(n-1);};
document.getElementById('btn-p').onclick=()=>{if(n<6&&!busy)updateCount(n+1);};
document.getElementById('btn-spin').onclick=fire;
document.getElementById('btn-timer').onclick=()=>{if(timerActive)stopTimer();else startTimer();};

(function(){const s=loadSettings();n=Math.min(Math.max(s.plateCount||4,1),6);document.getElementById('cnt').textContent=n;})();
build();drawFrame();
</script>
