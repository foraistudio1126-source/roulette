<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>07 対極 — TV MAGNET</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  background:#06060e;
  color:#e0e0e0;
  font-family:'Helvetica Neue',Arial,sans-serif;
  width:1920px; height:1080px;
  overflow:hidden;
  position:relative;
}
#back { position:fixed; top:16px; left:24px; font-size:13px; color:#444; text-decoration:none; letter-spacing:2px; z-index:200; }
#back:hover { color:#888; }
#title { position:fixed; top:16px; left:50%; transform:translateX(-50%); font-size:12px; color:#333; letter-spacing:6px; text-transform:uppercase; z-index:200; }

/* hemispheres */
#left-hemi {
  position:absolute; left:0; top:0; width:50%; height:100%;
  background:radial-gradient(ellipse at 30% 50%, rgba(255,51,68,0.06) 0%, transparent 60%);
  border-right:1px solid transparent;
}
#right-hemi {
  position:absolute; right:0; top:0; width:50%; height:100%;
  background:radial-gradient(ellipse at 70% 50%, rgba(51,136,255,0.06) 0%, transparent 60%);
}

/* division line */
#divider {
  position:absolute; left:50%; top:0; bottom:0; width:2px;
  transform:translateX(-50%);
  background:linear-gradient(180deg,
    transparent 0%,
    rgba(255,51,68,0.4) 15%,
    rgba(255,51,68,0.6) 30%,
    rgba(255,255,255,0.8) 48%,
    rgba(255,255,255,0.8) 52%,
    rgba(51,136,255,0.6) 70%,
    rgba(51,136,255,0.4) 85%,
    transparent 100%
  );
  z-index:10;
  box-shadow:0 0 20px rgba(255,255,255,0.1);
}
#divider::before {
  content:'';
  position:absolute; left:50%; top:0; bottom:0; width:20px;
  transform:translateX(-50%);
  background:linear-gradient(180deg,
    transparent,rgba(255,255,255,0.03) 50%,transparent
  );
}
/* energy pulse on divider */
.divider-pulse {
  position:absolute; left:-4px; width:10px; height:60px;
  background:linear-gradient(180deg,transparent,white,transparent);
  opacity:0;
  border-radius:50%;
  animation:pulseDrop 3s infinite;
}
@keyframes pulseDrop { 0%{opacity:0;top:-60px} 20%{opacity:0.4} 80%{opacity:0.2} 100%{opacity:0;top:1080px} }

/* result diamond */
#result-diamond {
  position:absolute; left:50%; top:50%;
  transform:translate(-50%,-50%) rotate(45deg);
  width:180px; height:180px;
  background:linear-gradient(135deg,#0f0f1a,#080810);
  border:2px solid #2a2a4a;
  z-index:20;
  box-shadow:0 0 40px rgba(0,0,0,0.8);
  display:flex; align-items:center; justify-content:center;
  transition:border-color 0.5s, box-shadow 0.5s;
}
#result-diamond.accident { border-color:#ff334488; box-shadow:0 0 60px rgba(255,51,68,0.4); }
#result-diamond.bonus { border-color:#3388ff88; box-shadow:0 0 60px rgba(51,136,255,0.4); }
#result-diamond-inner {
  transform:rotate(-45deg);
  text-align:center; padding:8px;
}
#result-label {
  font-size:11px; letter-spacing:3px; color:#333; text-transform:uppercase;
}
#result-value {
  font-size:18px; font-weight:700; letter-spacing:2px; color:#444;
  margin-top:4px; transition:all 0.5s;
  line-height:1.2;
}
#result-diamond.accident #result-value { color:#ff6677; text-shadow:0 0 20px #ff334466; font-size:15px; }
#result-diamond.bonus #result-value { color:#88aaff; text-shadow:0 0 20px #3388ff66; font-size:15px; }

/* pole labels */
.pole-corner {
  position:absolute; top:50%; transform:translateY(-50%);
  font-size:120px; font-weight:900; letter-spacing:8px;
  opacity:0.06; pointer-events:none; z-index:1;
}
#label-n { left:60px; color:#ff3344; }
#label-s { right:60px; color:#3388ff; }

/* dial groups */
#dials-left, #dials-right {
  position:absolute; top:0; bottom:0;
  width:calc(50% - 110px);
  display:flex; flex-direction:column;
  align-items:center; justify-content:space-evenly;
  padding:80px 0 80px;
  z-index:15;
}
#dials-left { left:0; }
#dials-right { right:0; }

.dial-card {
  width:300px; height:140px;
  background:linear-gradient(145deg,#0f0f1c,#080812);
  border-radius:6px;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  position:relative; overflow:hidden;
  gap:6px;
}
#dials-left .dial-card {
  border:2px solid #1e0a0e;
  box-shadow:0 0 20px rgba(255,51,68,0.05);
}
#dials-right .dial-card {
  border:2px solid #0a0e1e;
  box-shadow:0 0 20px rgba(51,136,255,0.05);
}
.dial-card.spinning-anim {
  animation:dialShake 0.15s infinite;
}
@keyframes dialShake {
  0%{transform:translateX(-1px)} 50%{transform:translateX(1px)} 100%{transform:translateX(-1px)}
}
#dials-left .dial-card.locked { border-color:#ff334488; box-shadow:0 0 30px rgba(255,51,68,0.3); }
#dials-right .dial-card.locked { border-color:#3388ff88; box-shadow:0 0 30px rgba(51,136,255,0.3); }

.dial-num { font-size:10px; letter-spacing:3px; color:#222; }
.dial-text {
  font-size:26px; font-weight:700; letter-spacing:2px;
  color:#444; text-align:center; padding:0 12px; line-height:1.2;
  transition:all 0.3s;
}
#dials-left .dial-card.locked .dial-text { color:#ff8888; text-shadow:0 0 15px #ff334466; font-size:28px; }
#dials-right .dial-card.locked .dial-text { color:#88aaff; text-shadow:0 0 15px #3388ff66; font-size:28px; }
.dial-pol { font-size:10px; letter-spacing:3px; color:#222; }
#dials-left .dial-card.locked .dial-pol { color:#ff6677; }
#dials-right .dial-card.locked .dial-pol { color:#66aaff; }
/* glass crack */
.dial-flash { position:absolute; inset:0; background:white; opacity:0; pointer-events:none; }
/* gauge needle decorative */
.dial-needle {
  position:absolute; bottom:6px; left:50%; transform:translateX(-50%);
  width:60px; height:3px;
  background:linear-gradient(90deg,transparent,#333,transparent);
  border-radius:2px;
}
#dials-left .dial-card.locked .dial-needle { background:linear-gradient(90deg,transparent,#ff334488,transparent); }
#dials-right .dial-card.locked .dial-needle { background:linear-gradient(90deg,transparent,#3388ff88,transparent); }

/* controls */
#controls {
  position:fixed; bottom:24px; left:50%; transform:translateX(-50%);
  display:flex; align-items:center; gap:40px; z-index:100;
}
.btn { padding:10px 28px; border:1.5px solid #333; background:linear-gradient(180deg,#18181f,#111118); color:#aaa; font-size:14px; letter-spacing:3px; text-transform:uppercase; cursor:pointer; border-radius:3px; transition:all 0.2s; }
.btn:hover { border-color:#555; color:#ddd; }
.btn.spin-btn { border-color:#ff3344; color:#ff6677; padding:12px 48px; font-size:16px; font-weight:700; }
.btn.spin-btn:hover { box-shadow:0 0 20px rgba(255,51,68,0.3); }
.btn.spin-btn:disabled { border-color:#333; color:#444; cursor:not-allowed; }
.count-display { width:48px; height:36px; background:#0d0d14; border:1px solid #2a2a3a; display:flex; align-items:center; justify-content:center; font-size:22px; font-weight:700; border-radius:2px; }
.ctrl-label { font-size:13px; color:#555; letter-spacing:3px; text-transform:uppercase; }
</style>
</head>
<body>
<div id="left-hemi"></div>
<div id="right-hemi"></div>
<div id="divider">
  <div class="divider-pulse" style="animation-delay:0s"></div>
  <div class="divider-pulse" style="animation-delay:1s"></div>
  <div class="divider-pulse" style="animation-delay:2s"></div>
</div>
<div class="pole-corner" id="label-n">N</div>
<div class="pole-corner" id="label-s">S</div>
<div id="dials-left"></div>
<div id="dials-right"></div>
<div id="result-diamond">
  <div id="result-diamond-inner">
    <div id="result-label">RESULT</div>
    <div id="result-value">待機中</div>
  </div>
</div>
<a href="index.html" id="back">← INDEX</a>
<div id="title">07 — 対極 / TAIKYOKU</div>
<div id="controls">
  <span class="ctrl-label">ダイアル数</span>
  <button class="btn" id="btn-minus">－</button>
  <div class="count-display" id="count-display">4</div>
  <button class="btn" id="btn-plus">＋</button>
  <button class="btn spin-btn" id="btn-spin">SPIN</button>
</div>

<script>
const ITEMS = [
  {text:'アニソン歌手',pol:'N'},{text:'方言で話す',pol:'S'},
  {text:'1分間無言',pol:'N'},{text:'ロボット口調',pol:'S'},
  {text:'囁き声',pol:'N'},{text:'怒り口調',pol:'S'},
  {text:'モノマネ',pol:'N'},{text:'超早口',pol:'S'},
  {text:'関西弁',pol:'N'},{text:'敬語禁止',pol:'S'},
];
let dialCount = 4, spinning = false;
let dialData = []; // {el, side, locked, item, cycleIdx}
const dialsLeft = document.getElementById('dials-left');
const dialsRight = document.getElementById('dials-right');

function build() {
  dialsLeft.innerHTML = ''; dialsRight.innerHTML = '';
  dialData = [];
  const leftCount = Math.ceil(dialCount/2);
  const rightCount = Math.floor(dialCount/2);
  for (let i=0; i<leftCount; i++) createDial('left', i);
  for (let i=0; i<rightCount; i++) createDial('right', i);
}

function createDial(side, idx) {
  const card = document.createElement('div');
  card.className = 'dial-card';
  const globalIdx = dialData.length;
  card.innerHTML = `
    <div class="dial-num">${side.toUpperCase()}-${String(idx+1).padStart(2,'0')}</div>
    <div class="dial-text">待機中</div>
    <div class="dial-pol">—</div>
    <div class="dial-needle"></div>
    <div class="dial-flash"></div>
  `;
  (side==='left' ? dialsLeft : dialsRight).appendChild(card);
  dialData.push({el:card, side, locked:false, item:null, cycleIdx:globalIdx});
}

let cycleIv;
function startCycling() {
  cycleIv = setInterval(()=>{
    dialData.forEach(dd=>{
      if (!dd.locked) {
        dd.cycleIdx = (dd.cycleIdx+1)%ITEMS.length;
        const item = ITEMS[dd.cycleIdx];
        dd.el.querySelector('.dial-text').textContent = item.text;
        dd.el.querySelector('.dial-pol').textContent = item.pol+'極';
        dd.el.classList.add('spinning-anim');
      }
    });
  },80);
}
function stopCycling(){ clearInterval(cycleIv); }

function spinAll() {
  if (spinning) return;
  spinning = true;
  document.getElementById('btn-spin').disabled = true;
  const rd = document.getElementById('result-diamond');
  const rv = document.getElementById('result-value');
  rd.className=''; rv.textContent='回転中';
  dialData.forEach(dd=>{dd.locked=false;dd.item=null;dd.el.className='dial-card';});
  startCycling();

  const results=[];
  dialData.forEach((dd,i)=>{
    setTimeout(()=>{
      dd.el.classList.remove('spinning-anim');
      const item=ITEMS[Math.floor(Math.random()*ITEMS.length)];
      dd.item=item; dd.locked=true;
      dd.el.classList.add('locked');
      dd.el.querySelector('.dial-text').textContent=item.text;
      dd.el.querySelector('.dial-pol').textContent=item.pol+'極';
      const flash=dd.el.querySelector('.dial-flash');
      flash.style.opacity='0.6'; setTimeout(()=>flash.style.opacity='0',100);
      results.push(item);
      if (results.length===dialData.length){stopCycling();setTimeout(()=>onAllDone(results),400);}
    }, 1400+i*500);
  });
}

function onAllDone(results){
  const rd=document.getElementById('result-diamond');
  const rv=document.getElementById('result-value');
  const nC=results.filter(r=>r.pol==='N').length, sC=results.filter(r=>r.pol==='S').length;
  if(nC===results.length){rv.textContent='⚡N極フルコンプ\n大事故⚡';rd.className='accident';}
  else if(sC===results.length){rv.textContent='⚡S極フルコンプ\n大事故⚡';rd.className='accident';}
  else if(nC===sC&&results.length%2===0){rv.textContent='✦完全対極\nボーナス✦';rd.className='bonus';}
  else{rv.textContent=results.map(r=>r.text).join(' / ');rd.className='';rv.style.fontSize='12px';}
  spinning=false; document.getElementById('btn-spin').disabled=false;
}

document.getElementById('btn-minus').onclick=()=>{if(dialCount>1&&!spinning){dialCount--;document.getElementById('count-display').textContent=dialCount;document.getElementById('result-diamond').className='';document.getElementById('result-value').textContent='待機中';document.getElementById('result-value').style.fontSize='';build();}};
document.getElementById('btn-plus').onclick=()=>{if(dialCount<6&&!spinning){dialCount++;document.getElementById('count-display').textContent=dialCount;document.getElementById('result-diamond').className='';document.getElementById('result-value').textContent='待機中';document.getElementById('result-value').style.fontSize='';build();}};
document.getElementById('btn-spin').onclick=spinAll;
build();
</script>
<script>
(function(){
  function fit(){
    var s=Math.min(window.innerWidth/1920,window.innerHeight/1080);
    document.body.style.transform="scale("+s+")";
    document.body.style.transformOrigin="top left";
    document.body.style.width="1920px";
    document.body.style.height="1080px";
    document.body.style.overflow="hidden";
    document.documentElement.style.overflow="hidden";
    document.documentElement.style.background="#06060e";
  }
  fit(); window.addEventListener("resize",fit);
})();
</script>
</body>
</html>
