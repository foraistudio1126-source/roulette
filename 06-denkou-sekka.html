<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>06 電光石火 — TV MAGNET</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  background:#050508;
  color:#e0e0e0;
  font-family:'Helvetica Neue',Arial,sans-serif;
  width:1920px; height:1080px;
  overflow:hidden;
  position:relative;
}
#back { position:fixed; top:16px; left:24px; font-size:13px; color:#444; text-decoration:none; letter-spacing:2px; z-index:200; }
#back:hover { color:#888; }
#title { position:fixed; top:16px; left:50%; transform:translateX(-50%); font-size:12px; color:#333; letter-spacing:6px; text-transform:uppercase; z-index:200; }

canvas#lightning { position:absolute; inset:0; z-index:0; pointer-events:none; }

#stage {
  position:relative; z-index:1;
  width:100%; height:100%;
  display:flex; align-items:center; justify-content:center;
}

/* Node strip: vertical chain of nodes */
#node-chain {
  position:relative;
  width:500px;
}

.node-wrapper {
  position:absolute;
  transform:translate(-50%,-50%);
}

.node {
  width:220px; height:100px;
  background:linear-gradient(145deg,#0f0f1a,#080810);
  border:2px solid #1e1e30;
  border-radius:6px;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  position:relative;
  overflow:hidden;
  transition:border-color 0.3s, box-shadow 0.3s;
  transform:translate(-50%,-50%);
}
.node.active-spin {
  border-color:#ff334455;
  box-shadow:0 0 20px rgba(255,51,68,0.2);
  animation:nodePulse 0.4s infinite alternate;
}
@keyframes nodePulse {
  from { box-shadow:0 0 15px rgba(255,51,68,0.2); }
  to { box-shadow:0 0 35px rgba(255,51,68,0.4); }
}
.node.locked-N {
  border-color:#ff3344aa;
  box-shadow:0 0 30px rgba(255,51,68,0.5), 0 0 60px rgba(255,51,68,0.2);
}
.node.locked-S {
  border-color:#3388ffaa;
  box-shadow:0 0 30px rgba(51,136,255,0.5), 0 0 60px rgba(51,136,255,0.2);
}
.node-num {
  position:absolute; top:4px; left:8px;
  font-size:10px; color:#222; letter-spacing:2px;
}
.node-text {
  font-size:28px; font-weight:700; letter-spacing:2px;
  color:#555;
  transition:color 0.2s, font-size 0.2s;
  text-align:center; padding:0 8px;
}
.node.locked-N .node-text { color:#ff8888; font-size:30px; text-shadow:0 0 20px #ff334466; }
.node.locked-S .node-text { color:#88aaff; font-size:30px; text-shadow:0 0 20px #3388ff66; }
.node-pol {
  font-size:10px; letter-spacing:3px; color:#333;
  margin-top:4px;
}
.node.locked-N .node-pol { color:#ff6677; }
.node.locked-S .node-pol { color:#66aaff; }
/* flash overlay */
.node-flash {
  position:absolute; inset:0;
  background:white; opacity:0;
  pointer-events:none; transition:opacity 0.1s;
}

/* result zone at bottom */
#result-zone {
  position:fixed;
  bottom:0; left:0; right:0; height:140px;
  display:flex; align-items:center; justify-content:center;
  background:linear-gradient(180deg,transparent,#050508 40%);
  z-index:50;
}
#result-text {
  font-size:60px; font-weight:900; letter-spacing:14px;
  color:#111; text-transform:uppercase;
  transition:all 0.5s;
}
#result-text.visible { color:#e0e0e0; }
#result-text.accident { color:#ff3344; text-shadow:0 0 40px #ff3344, 0 0 80px #ff334455; }
#result-text.bonus { color:#3388ff; text-shadow:0 0 40px #3388ff, 0 0 80px #3388ff55; }

#controls {
  position:fixed; bottom:18px; left:24px;
  display:flex; align-items:center; gap:20px; z-index:100;
}
.btn { padding:10px 28px; border:1.5px solid #333; background:linear-gradient(180deg,#18181f,#111118); color:#aaa; font-size:14px; letter-spacing:3px; text-transform:uppercase; cursor:pointer; border-radius:3px; transition:all 0.2s; }
.btn:hover { border-color:#555; color:#ddd; }
.btn.spin-btn { border-color:#ff3344; color:#ff6677; padding:12px 48px; font-size:16px; font-weight:700; }
.btn.spin-btn:hover { box-shadow:0 0 20px rgba(255,51,68,0.3); }
.btn.spin-btn:disabled { border-color:#333; color:#444; cursor:not-allowed; }
.count-display { width:48px; height:36px; background:#0d0d14; border:1px solid #2a2a3a; display:flex; align-items:center; justify-content:center; font-size:22px; font-weight:700; border-radius:2px; }
.ctrl-label { font-size:13px; color:#555; letter-spacing:3px; text-transform:uppercase; }
</style>
</head>
<body>
<canvas id="lightning"></canvas>
<a href="index.html" id="back">← INDEX</a>
<div id="title">06 — 電光石火 / DENKOU SEKKA</div>
<div id="stage">
  <div id="node-chain"></div>
</div>
<div id="result-zone"><div id="result-text">— STANDBY —</div></div>
<div id="controls">
  <span class="ctrl-label">ノード数</span>
  <button class="btn" id="btn-minus">－</button>
  <div class="count-display" id="count-display">3</div>
  <button class="btn" id="btn-plus">＋</button>
  <button class="btn spin-btn" id="btn-spin">SPIN</button>
</div>

<script>
const ITEMS = [
  {text:'アニソン歌手',pol:'N'},{text:'方言で話す',pol:'S'},
  {text:'1分間無言',pol:'N'},{text:'ロボット口調',pol:'S'},
  {text:'囁き声',pol:'N'},{text:'怒り口調',pol:'S'},
  {text:'モノマネ',pol:'N'},{text:'超早口',pol:'S'},
  {text:'関西弁',pol:'N'},{text:'敬語禁止',pol:'S'},
];
let nodeCount = 3, spinning = false;
let nodeData = []; // {el, x, y}
const chain = document.getElementById('node-chain');
const lCanvas = document.getElementById('lightning');
const lCtx = lCanvas.getContext('2d');
lCanvas.width = 1920; lCanvas.height = 1080;

// Node positions: zigzag vertically centered
function calcPositions(n) {
  const totalH = Math.min(800, n * 160);
  const startY = (1080 - totalH) / 2;
  const stepY = n > 1 ? totalH / (n-1) : 0;
  const xLeft = 960 - 120, xRight = 960 + 120;
  return Array.from({length:n}, (_,i) => ({
    x: n===1 ? 960 : (i%2===0 ? xLeft : xRight),
    y: n===1 ? 540 : startY + i * stepY
  }));
}

function buildNodes() {
  chain.innerHTML = '';
  nodeData = [];
  chain.style.width = '1920px';
  chain.style.height = '1080px';
  chain.style.position = 'absolute';
  chain.style.left = '0'; chain.style.top = '0';

  const positions = calcPositions(nodeCount);
  positions.forEach((pos, i) => {
    const wrapper = document.createElement('div');
    wrapper.className = 'node-wrapper';
    wrapper.style.left = pos.x + 'px';
    wrapper.style.top = pos.y + 'px';
    wrapper.style.position = 'absolute';

    const node = document.createElement('div');
    node.className = 'node';
    node.innerHTML = `
      <div class="node-num">NODE-${String(i+1).padStart(2,'0')}</div>
      <div class="node-text">待機中</div>
      <div class="node-pol"></div>
      <div class="node-flash"></div>
    `;
    wrapper.appendChild(node);
    chain.appendChild(wrapper);
    nodeData.push({node, x:pos.x, y:pos.y, locked:false, item:null, cycleIdx:i});
  });
  drawLightning(false);
}

function drawLightning(withEnergy, energizedUpTo=-1) {
  lCtx.clearRect(0,0,1920,1080);
  if (nodeData.length < 2) return;

  for (let i=0; i<nodeData.length-1; i++) {
    const a = nodeData[i], b = nodeData[i+1];
    const energized = energizedUpTo >= i+1;
    const baseAlpha = energized ? 0.9 : 0.25;
    const color = energized
      ? (nodeData[i+1].item?.pol === 'S' ? '#3388ff' : '#ff3344')
      : '#3a3a5a';

    // zigzag bolt
    const segs = 8;
    const pts = [{x:a.x, y:a.y}];
    for (let s=1; s<segs; s++) {
      const t = s/segs;
      const mx = a.x + (b.x - a.x)*t + (Math.random()-0.5)*20*(energized?2:1);
      const my = a.y + (b.y - a.y)*t + (Math.random()-0.5)*12*(energized?2:1);
      pts.push({x:mx, y:my});
    }
    pts.push({x:b.x, y:b.y});

    lCtx.save();
    lCtx.shadowColor = color;
    lCtx.shadowBlur = energized ? 20 : 5;
    lCtx.strokeStyle = color;
    lCtx.lineWidth = energized ? 3 : 1;
    lCtx.globalAlpha = baseAlpha;
    lCtx.beginPath();
    lCtx.moveTo(pts[0].x, pts[0].y);
    pts.forEach(p => lCtx.lineTo(p.x, p.y));
    lCtx.stroke();
    lCtx.restore();
  }
}

let lAnimId;
function animateLightning(energizedUpTo) {
  cancelAnimationFrame(lAnimId);
  function frame() {
    drawLightning(true, energizedUpTo);
    lAnimId = requestAnimationFrame(frame);
  }
  frame();
}

let cycleIv;
function startCycling() {
  cycleIv = setInterval(() => {
    nodeData.forEach(nd => {
      if (!nd.locked) {
        nd.cycleIdx = (nd.cycleIdx+1)%ITEMS.length;
        const item = ITEMS[nd.cycleIdx];
        nd.node.querySelector('.node-text').textContent = item.text;
      }
    });
  }, 80);
}
function stopCycling() { clearInterval(cycleIv); }

function spinAll() {
  if (spinning) return;
  spinning = true;
  document.getElementById('btn-spin').disabled = true;
  const rt = document.getElementById('result-text');
  rt.className = ''; rt.textContent = '— SPINNING —';
  nodeData.forEach(nd => { nd.locked=false; nd.item=null; nd.node.className='node active-spin'; nd.node.querySelector('.node-pol').textContent=''; });
  startCycling();
  cancelAnimationFrame(lAnimId);
  animateLightning(-1);

  const results = [];
  nodeData.forEach((nd, i) => {
    setTimeout(() => {
      const item = ITEMS[Math.floor(Math.random()*ITEMS.length)];
      nd.item = item; nd.locked = true;
      nd.node.className = `node locked-${item.pol}`;
      nd.node.querySelector('.node-text').textContent = item.text;
      nd.node.querySelector('.node-pol').textContent = `${item.pol}極`;
      // flash
      const flash = nd.node.querySelector('.node-flash');
      flash.style.opacity = '0.7';
      setTimeout(()=>flash.style.opacity='0',120);
      // energize bolt up to this node
      cancelAnimationFrame(lAnimId);
      animateLightning(i);
      results.push(item);
      if (results.length===nodeData.length) { stopCycling(); setTimeout(()=>onAllDone(results), 400); }
    }, 1200 + i*700);
  });
}

function onAllDone(results) {
  cancelAnimationFrame(lAnimId);
  drawLightning(true, nodeData.length);
  const nC=results.filter(r=>r.pol==='N').length, sC=results.filter(r=>r.pol==='S').length;
  const rt=document.getElementById('result-text');
  if(nC===results.length){rt.textContent='⚡ N極フルコンプ — 大事故 ⚡';rt.className='accident visible';}
  else if(sC===results.length){rt.textContent='⚡ S極フルコンプ — 大事故 ⚡';rt.className='accident visible';}
  else if(nC===sC&&results.length%2===0){rt.textContent='✦ 完全対極 — ボーナス ✦';rt.className='bonus visible';}
  else{rt.textContent=results.map(r=>r.text).join(' × ');rt.className='visible';rt.style.fontSize=results.length>3?'32px':'52px';}
  spinning=false; document.getElementById('btn-spin').disabled=false;
}

document.getElementById('btn-minus').onclick=()=>{if(nodeCount>1&&!spinning){nodeCount--;document.getElementById('count-display').textContent=nodeCount;cancelAnimationFrame(lAnimId);document.getElementById('result-text').textContent='— STANDBY —';document.getElementById('result-text').className='';buildNodes();}};
document.getElementById('btn-plus').onclick=()=>{if(nodeCount<6&&!spinning){nodeCount++;document.getElementById('count-display').textContent=nodeCount;cancelAnimationFrame(lAnimId);document.getElementById('result-text').textContent='— STANDBY —';document.getElementById('result-text').className='';buildNodes();}};
document.getElementById('btn-spin').onclick=spinAll;
buildNodes();
// idle lightning flicker
setInterval(()=>{ if(!spinning) drawLightning(false); }, 120);
</script>
<script>
(function(){
  function fit(){
    var s=Math.min(window.innerWidth/1920,window.innerHeight/1080);
    document.body.style.transform="scale("+s+")";
    document.body.style.transformOrigin="top left";
    document.body.style.width="1920px";
    document.body.style.height="1080px";
    document.body.style.overflow="hidden";
    document.documentElement.style.overflow="hidden";
    document.documentElement.style.background="#06060e";
  }
  fit(); window.addEventListener("resize",fit);
})();
</script>
</body>
</html>
