<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>09-D 連鎖 — TV MAGNET</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html,body { width:1920px; height:1080px; overflow:hidden; background:#05050c; font-family:'Helvetica Neue',Arial,sans-serif; color:#e0e0e0; }
#back { position:fixed; top:18px; left:28px; font-size:13px; color:#333; text-decoration:none; letter-spacing:2px; z-index:200; }
#back:hover { color:#666; }
#title { position:fixed; top:18px; left:50%; transform:translateX(-50%); font-size:12px; color:#222; letter-spacing:6px; z-index:200; }
canvas#bg { position:absolute; inset:0; z-index:0; pointer-events:none; }

/* central bullseye */
#bullseye { position:absolute; left:960px; top:540px; width:160px; height:160px; transform:translate(-50%,-50%); border-radius:50%; z-index:10; pointer-events:none; }

/* plates */
.plate-wrap { position:absolute; transform:translate(-50%,-50%); z-index:20; transition:left .25s cubic-bezier(.8,0,1,.8), top .25s cubic-bezier(.8,0,1,.8); }
.plate-box {
  width:210px; height:96px;
  background:linear-gradient(145deg,#0d0d1c,#080814);
  border:2px solid #1e1e30; border-radius:6px;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px;
  position:relative; transition:border-color .3s, box-shadow .3s;
}
.plate-box.N { border-color:rgba(255,51,68,.3); }
.plate-box.S { border-color:rgba(51,136,255,.3); }
.plate-box.locked.N { border-color:rgba(255,51,68,.9); box-shadow:0 0 30px rgba(255,51,68,.5); }
.plate-box.locked.S { border-color:rgba(51,136,255,.9); box-shadow:0 0 30px rgba(51,136,255,.5); }
.p-num { font-size:10px; letter-spacing:2px; color:#222; }
.p-text { font-size:26px; font-weight:700; letter-spacing:2px; color:#888; text-align:center; padding:0 8px; transition:color .3s; }
.plate-box.locked.N .p-text { color:#ffaaaa; text-shadow:0 0 16px #ff334455; }
.plate-box.locked.S .p-text { color:#aabbff; text-shadow:0 0 16px #3366ff55; }
.p-pol { font-size:11px; letter-spacing:3px; }
.plate-box.N .p-pol { color:rgba(255,80,100,.5); }
.plate-box.S .p-pol { color:rgba(80,130,255,.5); }
.plate-box.locked.N .p-pol { color:#ff7788; }
.plate-box.locked.S .p-pol { color:#7799ff; }
.p-flash { position:absolute; inset:0; background:#fff; opacity:0; border-radius:6px; pointer-events:none; }
/* chain line */
.chain-line { position:absolute; left:960px; top:540px; transform-origin:0 0; background:linear-gradient(90deg,transparent,rgba(255,180,50,.15),transparent); height:2px; z-index:5; pointer-events:none; transition:background .3s; }
.chain-line.energized { background:linear-gradient(90deg,transparent,rgba(255,200,80,.6),transparent); box-shadow:0 0 8px rgba(255,180,50,.4); }

/* result */
#result { position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); z-index:60; pointer-events:none; opacity:0; text-align:center; transition:opacity .5s; }
#result-text { font-size:58px; font-weight:900; letter-spacing:12px; }
#result.accident #result-text { color:#ff3344; text-shadow:0 0 40px #ff3344; }
#result.bonus #result-text { color:#3388ff; text-shadow:0 0 40px #3388ff; }
#result.show #result-text { color:#e0e0e0; }

#ui { position:fixed; bottom:20px; left:50%; transform:translateX(-50%); display:flex; align-items:center; gap:40px; z-index:100; }
.btn { padding:11px 30px; border:1.5px solid #2a2a3a; background:linear-gradient(180deg,#141420,#0e0e1a); color:#777; font-size:14px; letter-spacing:3px; cursor:pointer; border-radius:4px; transition:all .2s; }
.btn:hover { border-color:#444; color:#bbb; }
#btn-spin { border-color:#ffaa00; color:#ffcc44; padding:13px 56px; font-size:17px; font-weight:700; letter-spacing:5px; }
#btn-spin:hover { box-shadow:0 0 20px rgba(255,170,0,.4); }
#btn-spin:disabled { border-color:#222; color:#333; box-shadow:none; cursor:not-allowed; }
.lbl { font-size:13px; color:#444; letter-spacing:3px; }
.cnt { width:52px; height:38px; background:#0a0a14; border:1px solid #222; display:flex; align-items:center; justify-content:center; font-size:24px; font-weight:700; border-radius:3px; }
</style>
</head>
<body>
<canvas id="bg"></canvas>
<div id="bullseye"></div>
<div id="result"><div id="result-text"></div></div>
<a href="index.html" id="back">← INDEX</a>
<div id="title">09-D — 連鎖 / RENSA</div>
<div id="ui">
  <span class="lbl">プレート数</span>
  <button class="btn" id="btn-m">－</button>
  <div class="cnt" id="cnt">4</div>
  <button class="btn" id="btn-p">＋</button>
  <button class="btn" id="btn-spin">CHAIN FIRE</button>
</div>
<script>
const ITEMS=[{t:'アニソン歌手',p:'N'},{t:'方言で話す',p:'S'},{t:'1分間無言',p:'N'},{t:'ロボット口調',p:'S'},{t:'囁き声',p:'N'},{t:'怒り口調',p:'S'},{t:'モノマネ',p:'N'},{t:'超早口',p:'S'},{t:'関西弁',p:'N'},{t:'敬語禁止',p:'S'}];
const CX=960,CY=540,OUTER_R=400;
const bgC=document.getElementById('bg'),bgCtx=bgC.getContext('2d');
bgC.width=1920; bgC.height=1080;
let n=4,busy=false,plateData=[],bullRings=0,bullSpin=0,shockwaves=[];

function getAngles(c){ return Array.from({length:c},(_,i)=>-Math.PI/2+(i/c)*Math.PI*2); }

function build(){
  document.querySelectorAll('.plate-wrap,.chain-line').forEach(e=>e.remove());
  plateData=[];
  const angles=getAngles(n);
  angles.forEach((ang,i)=>{
    const ox=CX+Math.cos(ang)*OUTER_R, oy=CY+Math.sin(ang)*OUTER_R;
    // chain line
    const line=document.createElement('div'); line.className='chain-line';
    const dx=ox-CX,dy=oy-CY,len=Math.sqrt(dx*dx+dy*dy);
    line.style.width=len+'px'; line.style.transform=`rotate(${Math.atan2(dy,dx)}rad)`;
    document.body.appendChild(line);
    // plate
    const wrap=document.createElement('div'); wrap.className='plate-wrap';
    wrap.style.left=ox+'px'; wrap.style.top=oy+'px';
    const item=ITEMS[i%ITEMS.length];
    const box=document.createElement('div'); box.className=`plate-box ${item.p}`;
    box.innerHTML=`<div class="p-num">PLT-${String(i+1).padStart(2,'0')}</div><div class="p-text">${item.t}</div><div class="p-pol">${item.p} 極</div><div class="p-flash"></div>`;
    wrap.appendChild(box); document.body.appendChild(wrap);
    plateData.push({wrap,box,line,ox,oy,angle:ang,item,locked:false,cycleIdx:i});
  });
  bullRings=0;
}

function drawBg(){
  bgCtx.clearRect(0,0,1920,1080);
  // bullseye rings
  const rings=5+bullRings;
  for(let r=0;r<rings;r++){
    const radius=20+r*16+bullSpin*(rings-r)*0.3;
    const alpha=0.15-r*0.02+(bullRings>0?0.1:0);
    bgCtx.beginPath(); bgCtx.arc(CX,CY,radius,0,Math.PI*2);
    bgCtx.strokeStyle=`rgba(255,${160+r*10},${50+r*5},${alpha})`; bgCtx.lineWidth=2+bullRings; bgCtx.stroke();
  }
  // center dot
  bgCtx.beginPath(); bgCtx.arc(CX,CY,8,0,Math.PI*2);
  bgCtx.fillStyle=`rgba(255,180,50,${0.4+bullRings*0.1})`; bgCtx.fill();
  // shockwaves
  shockwaves=shockwaves.filter(sw=>{ sw.r+=7; sw.a-=0.03;
    if(sw.a<=0)return false;
    bgCtx.beginPath(); bgCtx.arc(CX,CY,sw.r,0,Math.PI*2);
    bgCtx.strokeStyle=`rgba(255,180,50,${sw.a})`; bgCtx.lineWidth=2; bgCtx.stroke(); return true; });
  bullSpin+=0.5;
}
setInterval(drawBg,20);

let cycleIv;
function startCycle(){ cycleIv=setInterval(()=>{ plateData.forEach((pd,i)=>{ if(!pd.locked){ pd.cycleIdx=(pd.cycleIdx+1)%ITEMS.length; pd.box.querySelector('.p-text').textContent=ITEMS[pd.cycleIdx].t; }}); },100); }
function stopCycle(){ clearInterval(cycleIv); }

function chainFire(){
  if(busy)return; busy=true;
  document.getElementById('btn-spin').disabled=true;
  document.getElementById('result').style.opacity='0'; document.getElementById('result').className='';
  plateData.forEach(pd=>{ pd.locked=false; pd.box.classList.remove('locked'); pd.wrap.style.left=pd.ox+'px'; pd.wrap.style.top=pd.oy+'px'; pd.line.classList.remove('energized'); });
  bullRings=0;
  startCycle();
  const results=[];
  plateData.forEach((pd,i)=>{
    setTimeout(()=>{
      const item=ITEMS[Math.floor(Math.random()*ITEMS.length)];
      pd.item=item; pd.locked=true;
      pd.box.querySelector('.p-text').textContent=item.t;
      pd.box.querySelector('.p-pol').textContent=item.p+' 極';
      pd.box.classList.add('locked');
      // fly to center
      pd.wrap.style.transition='left .22s cubic-bezier(.85,0,1,.9),top .22s cubic-bezier(.85,0,1,.9)';
      pd.wrap.style.left=CX+'px'; pd.wrap.style.top=CY+'px';
      setTimeout(()=>{
        const fl=pd.box.querySelector('.p-flash'); fl.style.opacity='.7'; setTimeout(()=>fl.style.opacity='0',110);
        pd.line.classList.add('energized');
        bullRings=Math.min(5,bullRings+1);
        shockwaves.push({r:20,a:0.9},{r:10,a:0.7});
        results.push(item);
        if(results.length===plateData.length){ stopCycle(); setTimeout(()=>showResult(results),500); }
      },240);
    },1000+i*500);
  });
}

function showResult(results){
  const nN=results.filter(r=>r.p==='N').length,nS=results.filter(r=>r.p==='S').length;
  const el=document.getElementById('result'),t=document.getElementById('result-text');
  if(nN===results.length){t.textContent='⚡ N極フルコンプ — 大事故 ⚡';el.className='accident';}
  else if(nS===results.length){t.textContent='⚡ S極フルコンプ — 大事故 ⚡';el.className='accident';}
  else if(nN===nS&&results.length%2===0){t.textContent='✦ 完全対極 — ボーナス ✦';el.className='bonus';}
  else{t.textContent=results.map(r=>r.t).join(' × ');t.style.fontSize=results.length>3?'32px':'52px';el.className='show';}
  el.style.opacity='1';
  busy=false; document.getElementById('btn-spin').disabled=false;
}
document.getElementById('btn-m').onclick=()=>{if(n>1&&!busy){n--;document.getElementById('cnt').textContent=n;document.getElementById('result').style.opacity='0';build();}};
document.getElementById('btn-p').onclick=()=>{if(n<6&&!busy){n++;document.getElementById('cnt').textContent=n;document.getElementById('result').style.opacity='0';build();}};
document.getElementById('btn-spin').onclick=chainFire;
build();
</script>
<script>(function(){function fit(){var s=Math.min(window.innerWidth/1920,window.innerHeight/1080);document.body.style.transform="scale("+s+")";document.body.style.transformOrigin="top left";document.documentElement.style.overflow="hidden";}fit();window.addEventListener("resize",fit);})();</script>
</body>
</html>
