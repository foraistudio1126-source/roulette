<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>10 交差点 — TV MAGNET</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  background:#05050c;
  color:#e0e0e0;
  font-family:'Helvetica Neue',Arial,sans-serif;
  width:1920px; height:1080px;
  overflow:hidden;
  position:relative;
}
#back { position:fixed; top:16px; left:24px; font-size:13px; color:#444; text-decoration:none; letter-spacing:2px; z-index:200; }
#back:hover { color:#888; }
#title { position:fixed; top:16px; left:50%; transform:translateX(-50%); font-size:12px; color:#333; letter-spacing:6px; text-transform:uppercase; z-index:200; }

canvas#grid { position:absolute; inset:0; z-index:0; pointer-events:none; }

#stage { position:relative; z-index:1; width:100%; height:100%; }

/* diamond panels */
.panel {
  position:absolute;
  width:190px; height:190px;
  transform:translate(-50%,-50%) rotate(45deg);
  background:linear-gradient(135deg,#0d0d1c,#080814);
  border:2px solid #1e1e30;
  display:flex; align-items:center; justify-content:center;
  transition:border-color 0.3s, box-shadow 0.3s;
  z-index:10;
}
.panel.spinning-p { border-color:#2a2a4a; animation:panelHum 0.3s infinite alternate; }
@keyframes panelHum { from{box-shadow:0 0 10px rgba(80,80,180,0.1)} to{box-shadow:0 0 25px rgba(80,80,180,0.25)} }
.panel.locked-N { border-color:#ff334488; box-shadow:0 0 30px rgba(255,51,68,0.4); }
.panel.locked-S { border-color:#3388ff88; box-shadow:0 0 30px rgba(51,136,255,0.4); }
.panel-inner {
  transform:rotate(-45deg);
  text-align:center;
  display:flex; flex-direction:column; align-items:center; gap:6px;
  padding:8px;
}
.panel-num { font-size:10px; letter-spacing:2px; color:#1e1e30; }
.panel-text {
  font-size:20px; font-weight:700; letter-spacing:2px;
  color:#444; line-height:1.2;
  transition:color 0.3s;
}
.panel.locked-N .panel-text { color:#ff8888; text-shadow:0 0 15px #ff334455; }
.panel.locked-S .panel-text { color:#88aaff; text-shadow:0 0 15px #3388ff55; }
.panel-pol { font-size:10px; letter-spacing:2px; color:#1e1e30; }
.panel.locked-N .panel-pol { color:#ff6677; }
.panel.locked-S .panel-pol { color:#66aaff; }
.panel-flash { position:absolute; inset:0; background:white; opacity:0; pointer-events:none; }

/* result node — appears at grid intersection */
#result-node {
  position:absolute; z-index:20;
  pointer-events:none; opacity:0;
  transition:opacity 0.5s;
  text-align:center;
  transform:translate(-50%,-50%);
}
#result-node-text {
  font-size:48px; font-weight:900; letter-spacing:10px;
  color:#fff; text-shadow:0 0 30px #fff;
  white-space:nowrap;
}
#result-node.accident #result-node-text { color:#ff3344; text-shadow:0 0 40px #ff3344, 0 0 80px #ff334455; }
#result-node.bonus #result-node-text { color:#3388ff; text-shadow:0 0 40px #3388ff, 0 0 80px #3388ff55; }

#controls {
  position:fixed; bottom:24px; left:50%; transform:translateX(-50%);
  display:flex; align-items:center; gap:40px; z-index:100;
}
.btn { padding:10px 28px; border:1.5px solid #333; background:linear-gradient(180deg,#18181f,#111118); color:#aaa; font-size:14px; letter-spacing:3px; text-transform:uppercase; cursor:pointer; border-radius:3px; transition:all 0.2s; }
.btn:hover { border-color:#555; color:#ddd; }
.btn.spin-btn { border-color:#4466ff; color:#6688ff; padding:12px 48px; font-size:16px; font-weight:700; }
.btn.spin-btn:hover { box-shadow:0 0 20px rgba(68,102,255,0.3); }
.btn.spin-btn:disabled { border-color:#333; color:#444; cursor:not-allowed; }
.count-display { width:48px; height:36px; background:#0d0d14; border:1px solid #2a2a3a; display:flex; align-items:center; justify-content:center; font-size:22px; font-weight:700; border-radius:2px; }
.ctrl-label { font-size:13px; color:#555; letter-spacing:3px; text-transform:uppercase; }
</style>
</head>
<body>
<canvas id="grid"></canvas>
<a href="index.html" id="back">← INDEX</a>
<div id="title">10 — 交差点 / KOUSATEN</div>
<div id="stage">
  <div id="result-node"><div id="result-node-text"></div></div>
</div>
<div id="controls">
  <span class="ctrl-label">ノード数</span>
  <button class="btn" id="btn-minus">－</button>
  <div class="count-display" id="count-display">4</div>
  <button class="btn" id="btn-plus">＋</button>
  <button class="btn spin-btn" id="btn-spin">CHARGE</button>
</div>

<script>
const ITEMS = [
  {text:'アニソン歌手',pol:'N'},{text:'方言で話す',pol:'S'},
  {text:'1分間無言',pol:'N'},{text:'ロボット口調',pol:'S'},
  {text:'囁き声',pol:'N'},{text:'怒り口調',pol:'S'},
  {text:'モノマネ',pol:'N'},{text:'超早口',pol:'S'},
  {text:'関西弁',pol:'N'},{text:'敬語禁止',pol:'S'},
];

// Grid positions for 1-6 nodes (pixel coords on 1920x1080)
const GRID_POSITIONS = {
  1: [[960,540]],
  2: [[700,540],[1220,540]],
  3: [[700,400],[1220,400],[960,680]],
  4: [[700,350],[1220,350],[700,730],[1220,730]],
  5: [[960,250],[660,470],[1260,470],[700,730],[1220,730]],
  6: [[660,280],[1260,280],[660,540],[1260,540],[660,800],[1260,800]],
};

const gCanvas = document.getElementById('grid');
const gCtx = gCanvas.getContext('2d');
gCanvas.width=1920; gCanvas.height=1080;

let nodeCount=4, spinning=false, panelData=[];
let beamEnergy=[]; // {x0,y0,x1,y1,alpha,color}
let gridT=0;

function buildPanels(){
  document.querySelectorAll('.panel').forEach(e=>e.remove());
  panelData=[];
  const positions=GRID_POSITIONS[nodeCount]||GRID_POSITIONS[4];
  positions.forEach((pos,i)=>{
    const panel=document.createElement('div');
    panel.className='panel';
    panel.style.left=pos[0]+'px'; panel.style.top=pos[1]+'px';
    panel.innerHTML=`<div class="panel-inner"><div class="panel-num">NODE-${String(i+1).padStart(2,'0')}</div><div class="panel-text">待機</div><div class="panel-pol">—</div></div><div class="panel-flash"></div>`;
    document.getElementById('stage').appendChild(panel);
    panelData.push({el:panel,x:pos[0],y:pos[1],locked:false,item:null,cycleIdx:i});
  });
  beamEnergy=[];
  document.getElementById('result-node').style.opacity='0';
}

function drawGrid(){
  gCtx.clearRect(0,0,1920,1080);
  const positions=GRID_POSITIONS[nodeCount]||GRID_POSITIONS[4];

  // draw beam connections between all node pairs
  for(let i=0;i<positions.length;i++){
    for(let j=i+1;j<positions.length;j++){
      const a=positions[i], b=positions[j];
      const pdA=panelData[i], pdB=panelData[j];
      const bothLocked=pdA?.locked&&pdB?.locked;
      const aPol=pdA?.item?.pol, bPol=pdB?.item?.pol;

      const pulse=0.04+0.02*Math.sin(gridT*0.05+i*0.7+j*0.5);
      let alpha=bothLocked?0.7:pulse;
      let color='rgba(50,50,100';
      if(bothLocked){
        if(aPol==='N'&&bPol==='N') color='rgba(255,51,68';
        else if(aPol==='S'&&bPol==='S') color='rgba(51,136,255';
        else color='rgba(180,80,255';
      }

      // draw beam as dashed line with glow if energized
      gCtx.save();
      if(bothLocked){
        gCtx.shadowColor=color+',1)'; gCtx.shadowBlur=12;
        gCtx.lineWidth=2.5;
        gCtx.setLineDash([]);
      } else {
        gCtx.shadowBlur=0; gCtx.lineWidth=1;
        gCtx.setLineDash([8,12]);
        gCtx.lineDashOffset=-gridT*0.3;
      }
      gCtx.strokeStyle=`${color},${alpha})`;
      gCtx.beginPath(); gCtx.moveTo(a[0],a[1]); gCtx.lineTo(b[0],b[1]);
      gCtx.stroke();
      gCtx.setLineDash([]);
      gCtx.restore();

      // midpoint intersection marker
      const mx=(a[0]+b[0])/2, my=(a[1]+b[1])/2;
      if(bothLocked){
        gCtx.beginPath(); gCtx.arc(mx,my,4,0,Math.PI*2);
        gCtx.fillStyle=`${color},0.8)`; gCtx.fill();
      }
    }
  }
  gridT++;
}

let gRaf;
function gridLoop(){drawGrid();gRaf=requestAnimationFrame(gridLoop);}
gridLoop();

let cycleIv;
function startCycling(){
  cycleIv=setInterval(()=>{
    panelData.forEach(pd=>{
      if(!pd.locked){
        pd.cycleIdx=(pd.cycleIdx+1)%ITEMS.length;
        const item=ITEMS[pd.cycleIdx];
        pd.el.querySelector('.panel-text').textContent=item.text;
        pd.el.querySelector('.panel-pol').textContent=item.pol+'極';
      }
    });
  },80);
}
function stopCycling(){clearInterval(cycleIv);}

function spinAll(){
  if(spinning) return;
  spinning=true;
  document.getElementById('btn-spin').disabled=true;
  document.getElementById('result-node').style.opacity='0';
  panelData.forEach(pd=>{pd.locked=false;pd.item=null;pd.el.className='panel spinning-p';pd.el.querySelector('.panel-text').textContent='待機';pd.el.querySelector('.panel-pol').textContent='—';});
  startCycling();

  const results=[];
  panelData.forEach((pd,i)=>{
    setTimeout(()=>{
      const item=ITEMS[Math.floor(Math.random()*ITEMS.length)];
      pd.item=item; pd.locked=true;
      pd.el.className=`panel locked-${item.pol}`;
      pd.el.querySelector('.panel-text').textContent=item.text;
      pd.el.querySelector('.panel-pol').textContent=item.pol+'極';
      const flash=pd.el.querySelector('.panel-flash');
      flash.style.opacity='0.7'; setTimeout(()=>flash.style.opacity='0',120);
      results.push(item);
      if(results.length===panelData.length){stopCycling();setTimeout(()=>onAllDone(results),500);}
    }, 1300+i*550);
  });
}

function onAllDone(results){
  const nC=results.filter(r=>r.pol==='N').length,sC=results.filter(r=>r.pol==='S').length;
  const rn=document.getElementById('result-node');
  const rt=document.getElementById('result-node-text');
  // place result node at center of all nodes
  const positions=GRID_POSITIONS[nodeCount]||GRID_POSITIONS[4];
  const cx=positions.reduce((s,p)=>s+p[0],0)/positions.length;
  const cy=positions.reduce((s,p)=>s+p[1],0)/positions.length;
  rn.style.left=cx+'px'; rn.style.top=cy+'px';

  if(nC===results.length){rt.textContent='⚡ 大事故 ⚡';rn.className='accident';rn.style.opacity='1';}
  else if(sC===results.length){rt.textContent='⚡ 大事故 ⚡';rn.className='accident';rn.style.opacity='1';}
  else if(nC===sC&&results.length%2===0){rt.textContent='✦ ボーナス ✦';rn.className='bonus';rn.style.opacity='1';}
  else{
    rt.textContent=results.map(r=>r.text).join(' × ');
    rt.style.fontSize=results.length>3?'24px':'40px';
    rn.className=''; rn.style.opacity='1';
  }
  spinning=false; document.getElementById('btn-spin').disabled=false;
}

document.getElementById('btn-minus').onclick=()=>{if(nodeCount>1&&!spinning){nodeCount--;document.getElementById('count-display').textContent=nodeCount;buildPanels();}};
document.getElementById('btn-plus').onclick=()=>{if(nodeCount<6&&!spinning){nodeCount++;document.getElementById('count-display').textContent=nodeCount;buildPanels();}};
document.getElementById('btn-spin').onclick=spinAll;
buildPanels();
</script>
<script>
(function(){
  function fit(){
    var s=Math.min(window.innerWidth/1920,window.innerHeight/1080);
    document.body.style.transform="scale("+s+")";
    document.body.style.transformOrigin="top left";
    document.body.style.width="1920px";
    document.body.style.height="1080px";
    document.body.style.overflow="hidden";
    document.documentElement.style.overflow="hidden";
    document.documentElement.style.background="#06060e";
  }
  fit(); window.addEventListener("resize",fit);
})();
</script>
</body>
</html>
