<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>03 鉄の柱 — TV MAGNET</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  background:#080810;
  color:#e0e0e0;
  font-family:'Helvetica Neue',Arial,sans-serif;
  width:1920px; height:1080px;
  overflow:hidden;
  position:relative;
}
/* metal floor texture */
body::after {
  content:'';
  position:fixed;
  bottom:0; left:0; right:0; height:120px;
  background:linear-gradient(180deg, transparent, #050508);
  pointer-events:none;
}
/* scanline */
body::before {
  content:'';
  position:fixed; inset:0;
  background: repeating-linear-gradient(0deg, transparent, transparent 3px, rgba(0,0,0,0.08) 3px, rgba(0,0,0,0.08) 4px);
  pointer-events:none; z-index:999;
}

#back { position:fixed; top:16px; left:24px; font-size:13px; color:#444; text-decoration:none; letter-spacing:2px; z-index:200; }
#back:hover { color:#888; }
#title { position:fixed; top:16px; left:50%; transform:translateX(-50%); font-size:12px; color:#333; letter-spacing:6px; text-transform:uppercase; z-index:200; }

/* crossbar result */
#crossbar {
  position:fixed;
  left:0; right:0;
  top:50%; transform:translateY(-50%) translateY(-320px);
  height:0;
  background:linear-gradient(180deg,#1a1a26,#13131e);
  border-top:3px solid #2a2a3a;
  border-bottom:3px solid #2a2a3a;
  display:flex; align-items:center; justify-content:center;
  overflow:hidden;
  z-index:50;
  transition:height 0.5s cubic-bezier(0.6,0,0.4,1);
  box-shadow:0 0 40px rgba(0,0,0,0.8);
}
#crossbar.open { height:100px; }
#crossbar-text {
  font-size:56px; font-weight:900; letter-spacing:12px;
  color:#333; opacity:0;
  transition:all 0.4s 0.3s;
  text-transform:uppercase;
}
#crossbar.open #crossbar-text { opacity:1; color:#e0e0e0; }
#crossbar.accident #crossbar-text { color:#ff3344; text-shadow:0 0 30px #ff3344; }
#crossbar.bonus #crossbar-text { color:#3388ff; text-shadow:0 0 30px #3388ff; }
/* crossbar rivets */
#crossbar::before, #crossbar::after {
  content:'● ● ● ● ● ● ● ● ● ● ● ●';
  position:absolute; left:20px;
  font-size:8px; letter-spacing:8px; color:#1e1e2e;
}
#crossbar::before { top:6px; }
#crossbar::after { bottom:6px; }

/* main stage */
#stage {
  position:relative;
  width:100%; height:100%;
  display:flex; align-items:flex-end; justify-content:center;
  padding-bottom:0;
  padding-top:80px;
}

#pillars {
  display:flex;
  align-items:flex-end;
  gap:12px;
  height:100%;
  padding:0 80px;
}

.pillar {
  flex:1;
  display:flex; flex-direction:column;
  align-items:center;
  height:100%;
  position:relative;
  transition:flex 0.4s;
}

/* pillar shaft */
.shaft {
  flex:1;
  width:100%;
  position:relative;
  background:linear-gradient(180deg,
    #0d0d14 0%,
    #111118 20%,
    #0d0d14 50%,
    #111118 80%,
    #0d0d14 100%
  );
  border-left:4px solid #1e2030;
  border-right:4px solid #1e2030;
  overflow:hidden;
}
/* metal shine */
.shaft::before {
  content:'';
  position:absolute;
  top:0; bottom:0; left:0; width:30%;
  background:linear-gradient(90deg,rgba(255,255,255,0.03),transparent);
  pointer-events:none;
}
/* rivet marks */
.shaft::after {
  content:'';
  position:absolute;
  top:0; bottom:0; left:50%;
  width:2px;
  background:repeating-linear-gradient(180deg,
    transparent,transparent 30px,
    #1a1a28 30px,#1a1a28 32px
  );
  transform:translateX(-50%);
  pointer-events:none;
}

/* viewport window */
.viewport {
  position:absolute;
  left:6px; right:6px;
  top:50%; transform:translateY(-50%);
  height:120px;
  overflow:hidden;
  border-top:3px solid #2a2a4a;
  border-bottom:3px solid #2a2a4a;
  background:#050508;
}
.viewport::before, .viewport::after {
  content:'';
  position:absolute;
  left:0; right:0; height:30px;
  z-index:5;
  pointer-events:none;
}
.viewport::before { top:0; background:linear-gradient(180deg,#050508,transparent); }
.viewport::after { bottom:0; background:linear-gradient(0deg,#050508,transparent); }

.item-strip {
  position:absolute;
  left:0; right:0;
  display:flex; flex-direction:column;
  will-change:transform;
}
.strip-item {
  height:120px; min-height:120px;
  display:flex; align-items:center; justify-content:center;
  flex-direction:column;
  gap:6px;
}
.strip-item .txt {
  font-size:28px; font-weight:700;
  letter-spacing:2px; color:#ccc;
  text-align:center;
  line-height:1.2;
}
.strip-item .pol {
  font-size:11px; letter-spacing:3px; color:#444;
}
.strip-item.N .pol { color:#ff6677; }
.strip-item.S .pol { color:#66aaff; }

/* locked state */
.pillar.locked .strip-item.active .txt { color:#fff; font-size:32px; }
.pillar.locked.N-lock .strip-item.active .txt { color:#ff6677; text-shadow:0 0 20px #ff334488; }
.pillar.locked.S-lock .strip-item.active .txt { color:#66aaff; text-shadow:0 0 20px #3388ff88; }

/* heat glow */
.heat-N { box-shadow:inset 0 0 0px rgba(255,51,68,0); transition:box-shadow 0.3s; }
.heat-N.spinning { box-shadow:inset 0 0 30px rgba(255,51,68,0.2); }
.heat-S { box-shadow:inset 0 0 0px rgba(51,136,255,0); transition:box-shadow 0.3s; }
.heat-S.spinning { box-shadow:inset 0 0 30px rgba(51,136,255,0.2); }

/* clamps */
.clamp-left, .clamp-right {
  position:absolute;
  top:50%; width:0;
  height:130px;
  transform:translateY(-50%);
  background:linear-gradient(180deg,#2a2a3a,#1a1a28,#2a2a3a);
  z-index:10;
  transition:width 0.15s cubic-bezier(0.8,0,1,0.8);
}
.clamp-left { left:0; border-right:3px solid #333; }
.clamp-right { right:0; border-left:3px solid #333; }
.pillar.locked .clamp-left, .pillar.locked .clamp-right { width:16px; }

/* pillar base */
.base {
  width:calc(100% + 16px);
  height:40px;
  background:linear-gradient(180deg,#1a1a28,#111118);
  border:2px solid #2a2a3a;
  border-radius:0 0 4px 4px;
  display:flex; align-items:center; justify-content:center;
  font-size:11px; letter-spacing:3px; color:#333;
}
/* spark canvas */
.sparks { position:absolute; inset:0; pointer-events:none; z-index:15; }

/* flash */
.flash { position:absolute; inset:0; background:white; opacity:0; z-index:8; pointer-events:none; }

/* controls */
#controls {
  position:fixed; bottom:24px; left:50%; transform:translateX(-50%);
  display:flex; align-items:center; gap:40px; z-index:100;
}
.btn {
  padding:10px 28px; border:1.5px solid #333;
  background:linear-gradient(180deg,#18181f,#111118);
  color:#aaa; font-size:14px; letter-spacing:3px; text-transform:uppercase;
  cursor:pointer; border-radius:3px; transition:all 0.2s;
}
.btn:hover { border-color:#555; color:#ddd; }
.btn.spin-btn { border-color:#ff3344; color:#ff6677; padding:12px 48px; font-size:16px; font-weight:700; }
.btn.spin-btn:hover { box-shadow:0 0 20px rgba(255,51,68,0.3); }
.btn.spin-btn:disabled { border-color:#333; color:#444; cursor:not-allowed; }
.count-display { width:48px; height:36px; background:#0d0d14; border:1px solid #2a2a3a; display:flex; align-items:center; justify-content:center; font-size:22px; font-weight:700; border-radius:2px; }
.ctrl-label { font-size:13px; color:#555; letter-spacing:3px; text-transform:uppercase; }
</style>
</head>
<body>
<a href="index.html" id="back">← INDEX</a>
<div id="title">03 — 鉄の柱 / TETSU NO HASHIRA</div>
<div id="crossbar"><div id="crossbar-text">— STANDBY —</div></div>

<div id="stage">
  <div id="pillars"></div>
</div>

<div id="controls">
  <span class="ctrl-label">柱の数</span>
  <button class="btn" id="btn-minus">－</button>
  <div class="count-display" id="count-display">3</div>
  <button class="btn" id="btn-plus">＋</button>
  <button class="btn spin-btn" id="btn-spin">SPIN</button>
</div>

<script>
const ITEMS = [
  {text:'アニソン歌手',pol:'N'},{text:'方言で話す',pol:'S'},
  {text:'1分間無言',pol:'N'},{text:'ロボット口調',pol:'S'},
  {text:'囁き声',pol:'N'},{text:'怒り口調',pol:'S'},
  {text:'モノマネ',pol:'N'},{text:'超早口',pol:'S'},
  {text:'関西弁',pol:'N'},{text:'敬語禁止',pol:'S'},
];
let cylCount = 3, spinning = false;
const container = document.getElementById('pillars');
const crossbar = document.getElementById('crossbar');
const crossbarText = document.getElementById('crossbar-text');

function build() {
  container.innerHTML = '';
  for (let i = 0; i < cylCount; i++) {
    const pol = i % 2 === 0 ? 'N' : 'S';
    const pillar = document.createElement('div');
    pillar.className = 'pillar';
    pillar.dataset.pol = pol;

    const shaft = document.createElement('div');
    shaft.className = `shaft heat-${pol}`;

    const vp = document.createElement('div');
    vp.className = 'viewport';

    const strip = document.createElement('div');
    strip.className = 'item-strip';
    const pool = [...ITEMS,...ITEMS,...ITEMS];
    pool.forEach((item, j) => {
      const d = document.createElement('div');
      d.className = `strip-item ${item.pol}`;
      d.innerHTML = `<div class="txt">${item.text}</div><div class="pol">${item.pol} 極</div>`;
      strip.appendChild(d);
    });
    vp.appendChild(strip);

    const clL = document.createElement('div'); clL.className = 'clamp-left';
    const clR = document.createElement('div'); clR.className = 'clamp-right';
    const flash = document.createElement('div'); flash.className = 'flash';
    const sparks = document.createElement('canvas'); sparks.className = 'sparks';

    shaft.appendChild(vp);
    shaft.appendChild(clL); shaft.appendChild(clR);
    shaft.appendChild(flash); shaft.appendChild(sparks);

    const base = document.createElement('div');
    base.className = 'base';
    base.textContent = `CYL-${String(i+1).padStart(2,'0')}`;

    pillar.appendChild(shaft);
    pillar.appendChild(base);
    container.appendChild(pillar);

    // init position
    strip.style.transform = `translateY(${-(10 * 120 - 0)}px)`;
  }
}

function spinAll() {
  if (spinning) return;
  spinning = true;
  document.getElementById('btn-spin').disabled = true;
  crossbar.className = '';
  crossbarText.textContent = '— SPINNING —';
  crossbarText.style.fontSize = '56px';

  const pillars = Array.from(container.querySelectorAll('.pillar'));
  pillars.forEach(p => {
    p.classList.remove('locked','N-lock','S-lock');
    p.querySelector('.shaft').classList.add('spinning');
    p.querySelectorAll('.strip-item').forEach(i => i.classList.remove('active'));
  });

  const results = [];
  pillars.forEach((pillar, idx) => {
    const strip = pillar.querySelector('.item-strip');
    const stopIdx = 10 + Math.floor(Math.random() * ITEMS.length);
    const stopY = -(stopIdx * 120);
    const dur = 1600 + idx * 500 + Math.random() * 400;

    setTimeout(() => {
      pillar.querySelector('.shaft').classList.remove('spinning');
      const overshoot = stopY - 20;
      strip.style.transition = `transform ${dur}ms cubic-bezier(0.12,0.9,0.3,1)`;
      strip.style.transform = `translateY(${overshoot}px)`;
      setTimeout(() => {
        strip.style.transition = 'transform 0.12s cubic-bezier(0.8,0,1,1)';
        strip.style.transform = `translateY(${stopY}px)`;
        setTimeout(() => {
          const flash = pillar.querySelector('.flash');
          flash.style.opacity = '0.6';
          setTimeout(() => flash.style.opacity = '0', 100);

          const item = ITEMS[stopIdx % ITEMS.length];
          pillar.classList.add('locked', item.pol === 'N' ? 'N-lock' : 'S-lock');
          const strips = pillar.querySelectorAll('.strip-item');
          if (strips[stopIdx]) strips[stopIdx].classList.add('active');

          // sparks
          fireSparkCanvas(pillar.querySelector('.sparks'), item.pol);
          results.push(item);
          if (results.length === pillars.length) onAllDone(results);
        }, 150);
      }, dur + 80);
    }, 200);
  });
}

function fireSparkCanvas(canvas, pol) {
  const rect = canvas.parentElement.getBoundingClientRect();
  canvas.width = rect.width || 200;
  canvas.height = rect.height || 700;
  const ctx = canvas.getContext('2d');
  const color = pol === 'N' ? '#ff3344' : '#3388ff';
  const cx = canvas.width / 2;
  const cy = canvas.height / 2;
  const sparks = Array.from({length:12}, () => ({
    x:cx, y:cy,
    vx:(Math.random()-0.5)*8,
    vy:(Math.random()-1)*6,
    life:1, maxLife:1
  }));
  function frame() {
    ctx.clearRect(0,0,canvas.width,canvas.height);
    sparks.forEach(s => {
      s.x += s.vx; s.y += s.vy; s.vy += 0.3;
      s.life -= 0.05;
      if (s.life > 0) {
        ctx.beginPath();
        ctx.arc(s.x, s.y, 2, 0, Math.PI*2);
        ctx.fillStyle = color + Math.floor(s.life*255).toString(16).padStart(2,'0');
        ctx.fill();
      }
    });
    if (sparks.some(s => s.life > 0)) requestAnimationFrame(frame);
    else ctx.clearRect(0,0,canvas.width,canvas.height);
  }
  requestAnimationFrame(frame);
}

function onAllDone(results) {
  const nCount = results.filter(r => r.pol==='N').length;
  const sCount = results.filter(r => r.pol==='S').length;
  setTimeout(() => {
    crossbar.classList.add('open');
    if (nCount === results.length) { crossbarText.textContent='⚡ N極フルコンプ — 大事故 ⚡'; crossbar.className='open accident'; }
    else if (sCount === results.length) { crossbarText.textContent='⚡ S極フルコンプ — 大事故 ⚡'; crossbar.className='open accident'; }
    else if (nCount === sCount && results.length%2===0) { crossbarText.textContent='✦ 完全対極 — ボーナス ✦'; crossbar.className='open bonus'; }
    else {
      crossbarText.style.fontSize = results.length > 3 ? '28px' : '40px';
      crossbarText.textContent = results.map(r=>r.text).join('  ×  ');
      crossbar.className = 'open';
    }
    spinning = false;
    document.getElementById('btn-spin').disabled = false;
  }, 400);
}

document.getElementById('btn-minus').onclick = () => {
  if (cylCount>1&&!spinning){cylCount--;document.getElementById('count-display').textContent=cylCount;crossbar.className='';crossbarText.textContent='— STANDBY —';build();}
};
document.getElementById('btn-plus').onclick = () => {
  if (cylCount<6&&!spinning){cylCount++;document.getElementById('count-display').textContent=cylCount;crossbar.className='';crossbarText.textContent='— STANDBY —';build();}
};
document.getElementById('btn-spin').onclick = spinAll;
build();
</script>
<script>
(function(){
  function fit(){
    var s=Math.min(window.innerWidth/1920,window.innerHeight/1080);
    document.body.style.transform="scale("+s+")";
    document.body.style.transformOrigin="top left";
    document.body.style.width="1920px";
    document.body.style.height="1080px";
    document.body.style.overflow="hidden";
    document.documentElement.style.overflow="hidden";
    document.documentElement.style.background="#06060e";
  }
  fit(); window.addEventListener("resize",fit);
})();
</script>
</body>
</html>
