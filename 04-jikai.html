<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>04 磁界 — TV MAGNET</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  background:#06060e;
  color:#e0e0e0;
  font-family:'Helvetica Neue',Arial,sans-serif;
  width:1920px; height:1080px;
  overflow:hidden;
  position:relative;
}
#back { position:fixed; top:16px; left:24px; font-size:13px; color:#444; text-decoration:none; letter-spacing:2px; z-index:200; }
#back:hover { color:#888; }
#title { position:fixed; top:16px; left:50%; transform:translateX(-50%); font-size:12px; color:#333; letter-spacing:6px; text-transform:uppercase; z-index:200; }

canvas#field { position:absolute; inset:0; z-index:0; }

/* N and S poles */
.pole {
  position:absolute;
  top:50%; transform:translateY(-50%);
  width:120px; height:300px;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:12px;
  z-index:10;
  border-radius:8px;
}
#pole-n {
  left:40px;
  background:linear-gradient(180deg,#1a0810,#200d14);
  border:2px solid #ff334455;
  box-shadow:0 0 40px rgba(255,51,68,0.2), inset 0 0 20px rgba(255,51,68,0.05);
}
#pole-s {
  right:40px;
  background:linear-gradient(180deg,#080d1a,#0d1220);
  border:2px solid #3388ff55;
  box-shadow:0 0 40px rgba(51,136,255,0.2), inset 0 0 20px rgba(51,136,255,0.05);
}
.pole-label {
  font-size:72px; font-weight:900; letter-spacing:4px;
}
#pole-n .pole-label { color:#ff3344; text-shadow:0 0 30px #ff334488; }
#pole-s .pole-label { color:#3388ff; text-shadow:0 0 30px #3388ff88; }
.pole-sub { font-size:11px; letter-spacing:3px; }
#pole-n .pole-sub { color:#ff334488; }
#pole-s .pole-sub { color:#3388ff88; }

/* orbs container */
#orbs-container {
  position:absolute;
  left:200px; right:200px;
  top:50%; transform:translateY(-50%);
  display:flex;
  align-items:center;
  justify-content:space-around;
  height:240px;
  z-index:20;
}

.orb {
  width:160px; height:160px;
  border-radius:50%;
  background:radial-gradient(circle at 35% 30%, #2a2a3a, #0d0d18 60%, #060610);
  border:2px solid #2a2a3a;
  box-shadow:0 0 30px rgba(0,0,0,0.8), inset 0 0 20px rgba(0,0,0,0.6);
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  position:relative;
  cursor:default;
  transition:transform 0.1s;
}
.orb-text {
  font-size:24px; font-weight:700;
  letter-spacing:2px; color:#ccc;
  text-align:center; padding:0 8px;
  line-height:1.2;
  transition:all 0.3s;
}
.orb-pol {
  font-size:10px; letter-spacing:3px; margin-top:6px;
  color:#444;
  transition:all 0.3s;
}
.orb.N-lock {
  border-color:#ff334488;
  box-shadow:0 0 40px rgba(255,51,68,0.4), 0 0 80px rgba(255,51,68,0.15), inset 0 0 20px rgba(255,51,68,0.05);
}
.orb.S-lock {
  border-color:#3388ff88;
  box-shadow:0 0 40px rgba(51,136,255,0.4), 0 0 80px rgba(51,136,255,0.15), inset 0 0 20px rgba(51,136,255,0.05);
}
.orb.N-lock .orb-text { color:#ff8888; text-shadow:0 0 20px #ff334466; }
.orb.S-lock .orb-text { color:#88aaff; text-shadow:0 0 20px #3388ff66; }
.orb.N-lock .orb-pol { color:#ff6677; }
.orb.S-lock .orb-pol { color:#66aaff; }

/* result nexus */
#nexus {
  position:absolute;
  left:50%; top:50%; transform:translate(-50%,-50%);
  z-index:30;
  pointer-events:none;
  opacity:0;
  transition:opacity 0.5s;
  text-align:center;
}
#nexus-text {
  font-size:56px; font-weight:900; letter-spacing:12px;
  color:#fff; text-shadow:0 0 40px #fff;
}
#nexus.accident #nexus-text { color:#ff3344; text-shadow:0 0 40px #ff3344, 0 0 80px #ff334466; }
#nexus.bonus #nexus-text { color:#3388ff; text-shadow:0 0 40px #3388ff, 0 0 80px #3388ff66; }

/* controls */
#controls {
  position:fixed; bottom:24px; left:50%; transform:translateX(-50%);
  display:flex; align-items:center; gap:40px; z-index:100;
}
.btn { padding:10px 28px; border:1.5px solid #333; background:linear-gradient(180deg,#18181f,#111118); color:#aaa; font-size:14px; letter-spacing:3px; text-transform:uppercase; cursor:pointer; border-radius:3px; transition:all 0.2s; }
.btn:hover { border-color:#555; color:#ddd; }
.btn.spin-btn { border-color:#ff3344; color:#ff6677; padding:12px 48px; font-size:16px; font-weight:700; }
.btn.spin-btn:hover { box-shadow:0 0 20px rgba(255,51,68,0.3); }
.btn.spin-btn:disabled { border-color:#333; color:#444; cursor:not-allowed; }
.count-display { width:48px; height:36px; background:#0d0d14; border:1px solid #2a2a3a; display:flex; align-items:center; justify-content:center; font-size:22px; font-weight:700; border-radius:2px; }
.ctrl-label { font-size:13px; color:#555; letter-spacing:3px; text-transform:uppercase; }
</style>
</head>
<body>
<canvas id="field"></canvas>
<a href="index.html" id="back">← INDEX</a>
<div id="title">04 — 磁界 / JIKAI</div>

<div id="pole-n" class="pole">
  <div class="pole-label">N</div>
  <div class="pole-sub">NORTH POLE</div>
</div>
<div id="pole-s" class="pole">
  <div class="pole-label">S</div>
  <div class="pole-sub">SOUTH POLE</div>
</div>

<div id="orbs-container"></div>
<div id="nexus"><div id="nexus-text"></div></div>

<div id="controls">
  <span class="ctrl-label">磁気球</span>
  <button class="btn" id="btn-minus">－</button>
  <div class="count-display" id="count-display">3</div>
  <button class="btn" id="btn-plus">＋</button>
  <button class="btn spin-btn" id="btn-spin">SPIN</button>
</div>

<script>
const ITEMS = [
  {text:'アニソン歌手',pol:'N'},{text:'方言で話す',pol:'S'},
  {text:'1分間無言',pol:'N'},{text:'ロボット口調',pol:'S'},
  {text:'囁き声',pol:'N'},{text:'怒り口調',pol:'S'},
  {text:'モノマネ',pol:'N'},{text:'超早口',pol:'S'},
  {text:'関西弁',pol:'N'},{text:'敬語禁止',pol:'S'},
];

const fieldCanvas = document.getElementById('field');
const fCtx = fieldCanvas.getContext('2d');
fieldCanvas.width = 1920; fieldCanvas.height = 1080;

let orbCount = 3, spinning = false;
let orbData = []; // {el, cycleInterval, oscPhase, locked, item}
let fieldT = 0;

function drawField() {
  fCtx.clearRect(0,0,1920,1080);
  const cx = 960, cy = 540;
  const poleX = 200, poleY = 540;
  const strength = 180 + Math.sin(fieldT * 0.02) * 10;

  // draw field lines from N to S
  const lineCount = 20;
  for (let l = 0; l < lineCount; l++) {
    const t0 = (l / lineCount) * Math.PI - Math.PI / 2;
    const pts = [];
    for (let step = 0; step <= 80; step++) {
      const t = t0 + (step / 80) * Math.PI;
      const r = strength * Math.abs(Math.sin(t));
      const px = cx + (r * Math.cos(t0 + Math.PI / 2)) * 3.5;
      const py = cy + r * Math.sin(t) * (l < lineCount/2 ? 1 : -1);
      pts.push([px, py]);
    }
    const alpha = 0.08 + 0.04 * Math.sin(fieldT * 0.015 + l * 0.3);
    const grad = fCtx.createLinearGradient(poleX, cy, 1920-poleX, cy);
    grad.addColorStop(0, `rgba(255,51,68,${alpha})`);
    grad.addColorStop(0.5, `rgba(180,100,255,${alpha * 0.6})`);
    grad.addColorStop(1, `rgba(51,136,255,${alpha})`);
    fCtx.beginPath();
    fCtx.moveTo(pts[0][0], pts[0][1]);
    pts.forEach(p => fCtx.lineTo(p[0], p[1]));
    fCtx.strokeStyle = grad;
    fCtx.lineWidth = 1.2;
    fCtx.stroke();
  }

  // center subtle glow
  const rg = fCtx.createRadialGradient(cx,cy,0,cx,cy,200);
  rg.addColorStop(0,'rgba(120,80,200,0.06)');
  rg.addColorStop(1,'transparent');
  fCtx.fillStyle = rg;
  fCtx.beginPath(); fCtx.arc(cx,cy,200,0,Math.PI*2); fCtx.fill();
  fieldT++;
}

function buildOrbs() {
  const container = document.getElementById('orbs-container');
  container.innerHTML = '';
  orbData = [];
  for (let i = 0; i < orbCount; i++) {
    const orb = document.createElement('div');
    orb.className = 'orb';
    orb.innerHTML = `<div class="orb-text">—</div><div class="orb-pol">待機中</div>`;
    container.appendChild(orb);
    orbData.push({el:orb, cycleIdx:0, oscPhase:i*1.2, locked:false, item:null});
  }
}

let cycleIntervalId = null;
function startCycling() {
  cycleIntervalId = setInterval(() => {
    orbData.forEach((od, i) => {
      if (!od.locked) {
        od.cycleIdx = (od.cycleIdx + 1) % ITEMS.length;
        const item = ITEMS[od.cycleIdx];
        od.el.querySelector('.orb-text').textContent = item.text;
        od.el.querySelector('.orb-pol').textContent = `${item.pol}極`;
      }
    });
  }, 80);
}
function stopCycling() { clearInterval(cycleIntervalId); }

// oscillation animation
let oscRaf;
function oscLoop() {
  const t = Date.now() * 0.003;
  orbData.forEach((od, i) => {
    if (!od.locked) {
      const y = Math.sin(t * 2 + od.oscPhase) * (spinning ? 18 : 4);
      od.el.style.transform = `translateY(${y}px)`;
    }
  });
  drawField();
  oscRaf = requestAnimationFrame(oscLoop);
}

function spinAll() {
  if (spinning) return;
  spinning = true;
  document.getElementById('btn-spin').disabled = true;
  document.getElementById('nexus').style.opacity = '0';
  document.getElementById('nexus').className = '';
  orbData.forEach(od => {
    od.locked = false;
    od.el.className = 'orb';
    od.el.style.transform = '';
  });
  startCycling();

  const results = [];
  orbData.forEach((od, i) => {
    const stopDelay = 1500 + i * 700;
    setTimeout(() => {
      const idx = Math.floor(Math.random() * ITEMS.length);
      const item = ITEMS[idx];
      od.item = item;
      od.locked = true;
      od.el.querySelector('.orb-text').textContent = item.text;
      od.el.querySelector('.orb-pol').textContent = `${item.pol}極`;
      od.el.classList.add(item.pol === 'N' ? 'N-lock' : 'S-lock');
      od.el.style.transform = 'translateY(0px)';
      results.push(item);
      if (results.length === orbData.length) {
        stopCycling();
        onAllDone(results);
      }
    }, stopDelay);
  });
}

function onAllDone(results) {
  const nCount = results.filter(r => r.pol==='N').length;
  const sCount = results.filter(r => r.pol==='S').length;
  const nexus = document.getElementById('nexus');
  const nexusText = document.getElementById('nexus-text');
  setTimeout(() => {
    nexus.style.opacity = '1';
    if (nCount === results.length) { nexusText.textContent='⚡ N極フルコンプ — 大事故 ⚡'; nexus.className='accident'; }
    else if (sCount === results.length) { nexusText.textContent='⚡ S極フルコンプ — 大事故 ⚡'; nexus.className='accident'; }
    else if (nCount === sCount && results.length%2===0) { nexusText.textContent='✦ 完全対極 — ボーナス ✦'; nexus.className='bonus'; }
    else { nexusText.textContent=results.map(r=>r.text).join(' × '); nexus.className=''; nexusText.style.fontSize='36px'; }
    spinning = false;
    document.getElementById('btn-spin').disabled = false;
  }, 600);
}

document.getElementById('btn-minus').onclick = () => {
  if (orbCount>1&&!spinning){orbCount--;document.getElementById('count-display').textContent=orbCount;document.getElementById('nexus').style.opacity='0';buildOrbs();}
};
document.getElementById('btn-plus').onclick = () => {
  if (orbCount<6&&!spinning){orbCount++;document.getElementById('count-display').textContent=orbCount;document.getElementById('nexus').style.opacity='0';buildOrbs();}
};
document.getElementById('btn-spin').onclick = spinAll;

buildOrbs();
oscLoop();
</script>
<script>
(function(){
  function fit(){
    var s=Math.min(window.innerWidth/1920,window.innerHeight/1080);
    document.body.style.transform="scale("+s+")";
    document.body.style.transformOrigin="top left";
    document.body.style.width="1920px";
    document.body.style.height="1080px";
    document.body.style.overflow="hidden";
    document.documentElement.style.overflow="hidden";
    document.documentElement.style.background="#06060e";
  }
  fit(); window.addEventListener("resize",fit);
})();
</script>
</body>
</html>
