<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>01 磁気スロット — TV MAGNET</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html, body {
  width:1920px; height:1080px;
  overflow:hidden;
  background:#08080f;
  font-family:'Helvetica Neue',Arial,sans-serif;
  color:#e0e0e0;
}
body::before {
  content:'';
  position:fixed; inset:0;
  background-image:
    linear-gradient(rgba(255,51,68,0.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(51,136,255,0.03) 1px, transparent 1px);
  background-size:80px 80px;
  pointer-events:none;
}
#header {
  width:100%; height:100px;
  display:flex; align-items:center; justify-content:center;
  border-bottom:1px solid #1a1a2a;
}
#header h1 {
  font-size:48px; font-weight:900; letter-spacing:16px;
  background:linear-gradient(90deg,#ff3344,#ffffff 40%,#3388ff);
  -webkit-background-clip:text; -webkit-text-fill-color:transparent;
}
#yaku {
  width:100%; height:80px;
  display:flex; align-items:center; justify-content:center;
}
#yaku-text {
  font-size:52px; font-weight:900; letter-spacing:12px; color:#222;
  transition:all 0.4s;
}
#yaku-text.show    { color:#e0e0e0; }
#yaku-text.accident{ color:#ff3344; text-shadow:0 0 30px #ff3344, 0 0 60px #ff334466; }
#yaku-text.bonus   { color:#3388ff; text-shadow:0 0 30px #3388ff, 0 0 60px #3388ff66; }
#slot-wrap {
  width:100%; height:720px;
  display:flex; align-items:center; justify-content:center;
  padding:20px 80px;
}
#slot-frame {
  width:100%; height:100%;
  background:#0a0a14;
  border:3px solid #252535;
  border-radius:8px;
  display:flex;
  overflow:hidden;
  position:relative;
  box-shadow:0 0 80px rgba(0,0,0,0.9), inset 0 0 40px rgba(0,0,0,0.6);
}
#slot-frame::before {
  content:'';
  position:absolute; left:0; right:0;
  top:calc(50% - 101px); height:2px;
  background:linear-gradient(90deg,transparent,#ff3344,transparent);
  box-shadow:0 0 12px #ff3344;
  z-index:20; pointer-events:none;
}
#slot-frame::after {
  content:'';
  position:absolute; left:0; right:0;
  top:calc(50% + 99px); height:2px;
  background:linear-gradient(90deg,transparent,#3388ff,transparent);
  box-shadow:0 0 12px #3388ff;
  z-index:20; pointer-events:none;
}
.cyl {
  flex:1;
  border-right:2px solid #1a1a28;
  position:relative;
  overflow:hidden;
  background:linear-gradient(180deg,#070710 0%,#0c0c1a 50%,#070710 100%);
}
.cyl:last-child { border-right:none; }
.cyl::before {
  content:''; position:absolute; left:0; right:0; top:0; height:120px;
  background:linear-gradient(180deg,#08080f,transparent); z-index:10;
}
.cyl::after {
  content:''; position:absolute; left:0; right:0; bottom:0; height:120px;
  background:linear-gradient(0deg,#08080f,transparent); z-index:10;
}
.cyl-strip { position:absolute; left:0; right:0; top:0; will-change:transform; }
.cyl-item {
  height:200px;
  display:flex; flex-direction:column;
  align-items:center; justify-content:center; gap:10px;
  position:relative;
}
.cyl-item + .cyl-item::before {
  content:''; position:absolute; top:0; left:10%; right:10%; height:1px;
  background:linear-gradient(90deg,transparent,#1e1e32,transparent);
}
.item-label {
  font-size:38px; font-weight:700; letter-spacing:3px;
  color:#b0b0cc; text-align:center; padding:0 12px; line-height:1.2;
}
.item-badge {
  font-size:12px; letter-spacing:4px;
  padding:3px 14px; border-radius:20px; border:1px solid;
}
.cyl-item.N .item-badge { color:#ff7788; border-color:#ff334444; background:rgba(255,51,68,0.06); }
.cyl-item.S .item-badge { color:#6699ff; border-color:#3366ff44; background:rgba(51,102,255,0.06); }
.cyl.locked .cyl-item.winner .item-label { font-size:42px; color:#fff; }
.cyl.lock-N .cyl-item.winner .item-label { color:#ffaaaa; text-shadow:0 0 20px #ff334466; }
.cyl.lock-S .cyl-item.winner .item-label { color:#aabbff; text-shadow:0 0 20px #3366ff66; }
.cyl.lock-N { box-shadow:inset 0 0 40px rgba(255,51,68,0.1); }
.cyl.lock-S { box-shadow:inset 0 0 40px rgba(51,102,255,0.1); }
.cyl-clamp { position:absolute; left:0; right:0; height:3px; z-index:15; opacity:0; transition:opacity 0.2s; }
.cyl-clamp.top { top:calc(50% - 101px); }
.cyl-clamp.bot { top:calc(50% + 98px); }
.cyl.lock-N .cyl-clamp { opacity:1; background:linear-gradient(90deg,transparent,#ff3344,transparent); box-shadow:0 0 10px #ff3344; }
.cyl.lock-S .cyl-clamp { opacity:1; background:linear-gradient(90deg,transparent,#3388ff,transparent); box-shadow:0 0 10px #3388ff; }
.cyl-flash { position:absolute; inset:0; background:#fff; opacity:0; z-index:8; pointer-events:none; }
#controls {
  width:100%; height:80px;
  display:flex; align-items:center; justify-content:center; gap:48px;
}
.ctrl-label { font-size:14px; color:#555; letter-spacing:4px; text-transform:uppercase; }
.btn {
  padding:12px 32px; border:1.5px solid #2a2a3a;
  background:linear-gradient(180deg,#141420,#0e0e1a);
  color:#888; font-size:15px; letter-spacing:4px;
  cursor:pointer; border-radius:4px; transition:all 0.2s; text-transform:uppercase;
}
.btn:hover { border-color:#444; color:#ccc; }
#btn-spin {
  border-color:#ff3344; color:#ff6677;
  padding:14px 60px; font-size:18px; font-weight:700; letter-spacing:6px;
}
#btn-spin:hover { box-shadow:0 0 24px rgba(255,51,68,0.4); }
#btn-spin:disabled { border-color:#222; color:#333; box-shadow:none; cursor:not-allowed; }
.count-num {
  width:56px; height:40px; background:#0a0a14; border:1px solid #252535;
  display:flex; align-items:center; justify-content:center;
  font-size:26px; font-weight:700; border-radius:3px;
}
#back { position:fixed; top:18px; left:28px; font-size:13px; color:#333; text-decoration:none; letter-spacing:2px; z-index:200; }
#back:hover { color:#666; }
</style>
</head>
<body>
<a href="index.html" id="back">← INDEX</a>
<div id="header"><h1>MAGNETIC × ROULETTE</h1></div>
<div id="yaku"><div id="yaku-text">— STANDBY —</div></div>
<div id="slot-wrap"><div id="slot-frame"></div></div>
<div id="controls">
  <span class="ctrl-label">シリンダー数</span>
  <button class="btn" id="btn-m">－</button>
  <div class="count-num" id="count-num">3</div>
  <button class="btn" id="btn-p">＋</button>
  <button class="btn" id="btn-spin">SPIN</button>
</div>
<script>
const ITEMS=[
  {text:'アニソン歌手',pol:'N'},{text:'方言で話す',pol:'S'},
  {text:'1分間無言',pol:'N'},{text:'ロボット口調',pol:'S'},
  {text:'囁き声',pol:'N'},{text:'怒り口調',pol:'S'},
  {text:'モノマネ',pol:'N'},{text:'超早口',pol:'S'},
  {text:'関西弁',pol:'N'},{text:'敬語禁止',pol:'S'},
];
const ITEM_H=200;
let cylCount=3, busy=false;
const frame=document.getElementById('slot-frame');
const yakuText=document.getElementById('yaku-text');

function buildSlot(){
  frame.innerHTML='';
  for(let c=0;c<cylCount;c++){
    const cyl=document.createElement('div'); cyl.className='cyl';
    const clT=document.createElement('div'); clT.className='cyl-clamp top';
    const clB=document.createElement('div'); clB.className='cyl-clamp bot';
    const flash=document.createElement('div'); flash.className='cyl-flash';
    const strip=document.createElement('div'); strip.className='cyl-strip';
    const pool=[...ITEMS,...ITEMS,...ITEMS,...ITEMS];
    pool.forEach(item=>{
      const d=document.createElement('div');
      d.className=`cyl-item ${item.pol}`;
      d.innerHTML=`<div class="item-label">${item.text}</div><div class="item-badge">${item.pol==='N'?'N 極':'S 極'}</div>`;
      strip.appendChild(d);
    });
    cyl.appendChild(strip); cyl.appendChild(clT); cyl.appendChild(clB); cyl.appendChild(flash);
    frame.appendChild(cyl);
    const frameH=frame.offsetHeight||680;
    const centerY=frameH/2-ITEM_H/2;
    strip.style.transform=`translateY(${-(10*ITEM_H-centerY)}px)`;
  }
}

function spin(){
  if(busy)return;
  busy=true;
  document.getElementById('btn-spin').disabled=true;
  yakuText.className=''; yakuText.textContent='— SPINNING —'; yakuText.style.fontSize='';
  const cyls=Array.from(frame.querySelectorAll('.cyl'));
  cyls.forEach(c=>{c.classList.remove('locked','lock-N','lock-S');c.querySelectorAll('.cyl-item').forEach(i=>i.classList.remove('winner'));});
  const results=[];
  const frameH=frame.offsetHeight||680;
  const centerY=frameH/2-ITEM_H/2;
  cyls.forEach((cyl,i)=>{
    const strip=cyl.querySelector('.cyl-strip');
    const stopIdx=10+Math.floor(Math.random()*ITEMS.length);
    const stopY=-(stopIdx*ITEM_H-centerY);
    const dur=1400+i*450+Math.random()*300;
    setTimeout(()=>{
      strip.style.transition=`transform ${dur}ms cubic-bezier(0.05,0.85,0.15,1.0)`;
      strip.style.transform=`translateY(${stopY-28}px)`;
      setTimeout(()=>{
        strip.style.transition='transform 0.13s cubic-bezier(0.8,0,1,1)';
        strip.style.transform=`translateY(${stopY}px)`;
        setTimeout(()=>{
          const flash=cyl.querySelector('.cyl-flash');
          flash.style.opacity='0.6'; setTimeout(()=>flash.style.opacity='0',100);
          const item=ITEMS[stopIdx%ITEMS.length];
          cyl.classList.add('locked',`lock-${item.pol}`);
          const allItems=cyl.querySelectorAll('.cyl-item');
          if(allItems[stopIdx])allItems[stopIdx].classList.add('winner');
          results.push(item);
          if(results.length===cyls.length)onAllDone(results);
        },160);
      },dur+60);
    },200+i*50);
  });
}

function onAllDone(results){
  const nN=results.filter(r=>r.pol==='N').length;
  const nS=results.filter(r=>r.pol==='S').length;
  setTimeout(()=>{
    if(nN===results.length){yakuText.textContent='⚡ N極フルコンプ ── 大事故 ⚡';yakuText.className='accident';}
    else if(nS===results.length){yakuText.textContent='⚡ S極フルコンプ ── 大事故 ⚡';yakuText.className='accident';}
    else if(nN===nS&&results.length%2===0){yakuText.textContent='✦ 完全対極 ── ボーナス ✦';yakuText.className='bonus';}
    else{yakuText.style.fontSize=results.length>3?'30px':'44px';yakuText.textContent=results.map(r=>r.text).join('　×　');yakuText.className='show';}
    busy=false; document.getElementById('btn-spin').disabled=false;
  },500);
}

document.getElementById('btn-m').onclick=()=>{if(cylCount>1&&!busy){cylCount--;document.getElementById('count-num').textContent=cylCount;yakuText.textContent='— STANDBY —';yakuText.className='';buildSlot();}};
document.getElementById('btn-p').onclick=()=>{if(cylCount<6&&!busy){cylCount++;document.getElementById('count-num').textContent=cylCount;yakuText.textContent='— STANDBY —';yakuText.className='';buildSlot();}};
document.getElementById('btn-spin').onclick=spin;
buildSlot();
</script>
<script>
(function(){
  function fit(){
    var s=Math.min(window.innerWidth/1920,window.innerHeight/1080);
    document.body.style.transform="scale("+s+")";
    document.body.style.transformOrigin="top left";
    document.documentElement.style.overflow="hidden";
  }
  fit(); window.addEventListener("resize",fit);
})();
</script>
</body>
</html>
